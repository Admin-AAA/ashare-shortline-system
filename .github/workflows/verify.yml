name: verify

on:
  push:
    branches: [main, kiro_refactoring]
  pull_request:
    branches: [main]

jobs:
  python-compile-import:
    name: Python compile + import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Compile all
        run: python -m compileall app -q
      - name: Import smoke
        run: python -c "import app.main; print('import ok')"

  python-unit:
    name: Python unit tests (no MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run unit tests
        env:
          RUN_REAL_MYSQL_S6: "0"
        run: python -m pytest app/ -q --tb=short

  python-regression-no-db:
    name: Python regression tests (no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ASHARE_DATABASE_URL: sqlite://
      RUN_REAL_MYSQL_S6: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run non-database regression suite
        run: python -m pytest tests/ -m "not integration" -q --tb=short

  python-mysql-integration:
    name: Python MySQL integration smoke tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: ashare_workbench
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      ASHARE_DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/ashare_workbench?charset=utf8mb4
      RUN_REAL_MYSQL_S6: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Apply schema migrations
        run: alembic upgrade head
      - name: Run MySQL integration smoke tests
        run: >-
          python -m pytest
          tests/test_charset_utf8mb4.py
          tests/test_persist_market_idempotent.py
          tests/test_outcome_label_serialization.py
          -q --tb=short

  architecture-check:
    name: Architecture dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run architecture check
        run: python3 scripts/check_architecture.py

  governance-store-check:
    name: Governance artifact layout check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate immutable governance artifacts
        run: python3 backend/scripts/check_governance_store.py

  git-check:
    name: Git diff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: git diff --check
        run: git diff --check HEAD~1 HEAD

  frontend-build:
    name: Frontend v2 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
