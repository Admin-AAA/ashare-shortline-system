name: verify

on:
  push:
    branches: [main, kiro_refactoring]
  pull_request:
    branches: [main]

jobs:
  python-compile-import:
    name: Python compile + import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Compile all
        run: python -m compileall app -q
      - name: Import smoke
        run: python -c "import app.main; print('import ok')"

  python-unit:
    name: Python unit tests (no MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run unit tests
        env:
          RUN_REAL_MYSQL_S6: "0"
        run: python -m pytest app/ -q --tb=short

  architecture-check:
    name: Architecture dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run architecture check
        run: python3 scripts/check_architecture.py

  git-check:
    name: Git diff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: git diff --check
        run: git diff --check HEAD~1 HEAD || true

  frontend-build:
    name: Frontend v2 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
