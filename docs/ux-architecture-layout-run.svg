<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" width="100%">
  <title>推荐运行页布局优化建议</title>
  <desc>操作区 sticky 置顶，下方依次为运行时间线、结果摘要、候选预览，形成清晰的执行-进度-产出三段式布局。</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1efe8" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="680" height="520" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#26215c">推荐运行页布局优化建议</text>
  <text x="340" y="44" text-anchor="middle" font-size="12" fill="#5f5e5a">执行 / 进度 / 产出三段式，关键操作 sticky 置顶</text>

  <!-- 顶部栏占位 -->
  <rect x="40" y="60" width="600" height="34" rx="6" fill="#f3f4f6" stroke="#b4b2a9" stroke-width="0.5"/>
  <text x="60" y="80" font-size="11" fill="#5f5e5a">品牌 · 洞察 · 执行 · 分析 · 系统 · 运行推荐 · 通知</text>

  <!-- 操作区（sticky） -->
  <rect x="40" y="108" width="600" height="56" rx="8" fill="#ffffff" stroke="#378add" stroke-width="1"/>
  <text x="60" y="132" font-size="13" font-weight="500" fill="#042c53">推荐执行</text>
  <rect x="180" y="118" width="140" height="36" rx="6" fill="#f3f4f6" stroke="#b4b2a9" stroke-width="0.5"/>
  <text x="250" y="138" text-anchor="middle" font-size="11" fill="#2c2c2a">预设选择 ▼</text>
  <rect x="334" y="118" width="120" height="36" rx="6" fill="#f3f4f6" stroke="#b4b2a9" stroke-width="0.5"/>
  <text x="394" y="138" text-anchor="middle" font-size="11" fill="#2c2c2a">数据源 ▼</text>
  <rect x="470" y="118" width="150" height="36" rx="6" fill="#378add" stroke="#378add" stroke-width="0.5"/>
  <text x="545" y="138" text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff">立即运行</text>

  <!-- 运行时间线 -->
  <rect x="40" y="180" width="600" height="120" rx="8" fill="#ffffff" stroke="#d3d1c7" stroke-width="0.5"/>
  <text x="60" y="204" font-size="13" font-weight="500" fill="#2c2c2a">运行时间线</text>
  <rect x="60" y="224" width="120" height="56" rx="6" fill="#eaf3de" stroke="#639922" stroke-width="0.5"/>
  <text x="120" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#173404">数据池准备</text>
  <text x="120" y="260" text-anchor="middle" font-size="10" fill="#27500a">已完成</text>
  <rect x="200" y="224" width="120" height="56" rx="6" fill="#eaf3de" stroke="#639922" stroke-width="0.5"/>
  <text x="260" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#173404">候选过滤</text>
  <text x="260" y="260" text-anchor="middle" font-size="10" fill="#27500a">已完成</text>
  <rect x="340" y="224" width="120" height="56" rx="6" fill="#faeeda" stroke="#ef9f27" stroke-width="1"/>
  <text x="400" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#412402">Skill 审查</text>
  <text x="400" y="260" text-anchor="middle" font-size="10" fill="#854f0b">当前阶段</text>
  <rect x="480" y="224" width="120" height="56" rx="6" fill="#f3f4f6" stroke="#b4b2a9" stroke-width="0.5"/>
  <text x="540" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#2c2c2a">聚合落库</text>
  <text x="540" y="260" text-anchor="middle" font-size="10" fill="#5f5e5a">待执行</text>

  <!-- 结果摘要 -->
  <rect x="40" y="314" width="290" height="120" rx="8" fill="#ffffff" stroke="#d3d1c7" stroke-width="0.5"/>
  <text x="60" y="338" font-size="13" font-weight="500" fill="#2c2c2a">运行结果摘要</text>
  <rect x="60" y="358" width="60" height="40" rx="6" fill="#f9fafb" stroke="#d3d1c7" stroke-width="0.5"/>
  <text x="90" y="374" text-anchor="middle" font-size="10" fill="#5f5e5a">股票池</text>
  <text x="90" y="390" text-anchor="middle" font-size="12" font-weight="500" fill="#2c2c2a">4826</text>
  <rect x="130" y="358" width="60" height="40" rx="6" fill="#f9fafb" stroke="#d3d1c7" stroke-width="0.5"/>
  <text x="160" y="374" text-anchor="middle" font-size="10" fill="#5f5e5a">推荐</text>
  <text x="160" y="390" text-anchor="middle" font-size="12" font-weight="500" fill="#2c2c2a">12</text>
  <rect x="200" y="358" width="110" height="40" rx="6" fill="#f9fafb" stroke="#d3d1c7" stroke-width="0.5"/>
  <text x="255" y="374" text-anchor="middle" font-size="10" fill="#5f5e5a">Agent 调用</text>
  <text x="255" y="390" text-anchor="middle" font-size="12" font-weight="500" fill="#2c2c2a">24</text>
  <text x="60" y="420" font-size="11" fill="#5f5e5a">数据源：本地池优先 · 状态：运行中</text>

  <!-- 候选预览 -->
  <rect x="350" y="314" width="290" height="120" rx="8" fill="#ffffff" stroke="#d3d1c7" stroke-width="0.5"/>
  <text x="370" y="338" font-size="13" font-weight="500" fill="#2c2c2a">候选预览</text>
  <text x="580" y="338" text-anchor="end" font-size="11" fill="#378add" font-weight="500">查看全部 →</text>
  <rect x="370" y="358" width="250" height="28" rx="6" fill="#f9fafb" stroke="#d3d1c7" stroke-width="0.5"/>
  <text x="380" y="376" font-size="11" fill="#2c2c2a">候选 1 · 000001 · 85.4 · 突破买点</text>
  <rect x="370" y="392" width="250" height="28" rx="6" fill="#f9fafb" stroke="#d3d1c7" stroke-width="0.5"/>
  <text x="380" y="410" font-size="11" fill="#2c2c2a">候选 2 · 000002 · 82.1 · 回踩买点</text>

  <!-- 底部说明 -->
  <text x="40" y="460" font-size="11" font-weight="500" fill="#26215c">设计要点</text>
  <text x="40" y="480" font-size="11" fill="#5f5e5a">1. 操作区 sticky，长页面仍可快速触发新运行；2. 时间线当前阶段高亮；3. 运行完成后直接展示候选预览，减少跳转。</text>
</svg>