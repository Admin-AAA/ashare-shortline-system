<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" role="img" width="100%">
  <title>AShare 当前用户流程与断点</title>
  <desc>从首页出发，核心功能被折叠在测试窗口抽屉中，跨页跳转依赖 sessionStorage 和自定义事件，存在多个断点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#26215c">当前用户流程与断点</text>
  <text x="340" y="46" text-anchor="middle" font-size="12" fill="#5f5e5a">核心生产功能被折叠在“测试窗口”抽屉，跨页状态依赖 sessionStorage</text>

  <!-- 首页 -->
  <g>
    <rect x="270" y="70" width="140" height="48" rx="10" fill="#e6f1fb" stroke="#378add" stroke-width="0.5"/>
    <text x="340" y="90" text-anchor="middle" font-size="14" font-weight="500" fill="#042c53" dominant-baseline="central">首页</text>
    <text x="340" y="104" text-anchor="middle" font-size="11" fill="#0c447c" dominant-baseline="central">仅 2 个入口</text>
  </g>

  <!-- 矩阵推荐 -->
  <g>
    <rect x="80" y="160" width="120" height="40" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.5"/>
    <text x="140" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="#04342c" dominant-baseline="central">矩阵推荐</text>
    <text x="140" y="212" text-anchor="middle" font-size="11" fill="#5f5e5a">入口直接可见</text>
  </g>
  <line x1="270" y1="94" x2="200" y2="170" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 策略 -->
  <g>
    <rect x="260" y="160" width="120" height="40" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="0.5"/>
    <text x="320" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="#4a1b0c" dominant-baseline="central">策略</text>
    <text x="320" y="212" text-anchor="middle" font-size="11" fill="#5f5e5a">入口直接可见</text>
  </g>
  <line x1="340" y1="118" x2="320" y2="160" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 测试窗口抽屉 -->
  <g>
    <rect x="440" y="160" width="160" height="40" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="520" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="#26215c" dominant-baseline="central">配置窗口抽屉</text>
    <text x="520" y="212" text-anchor="middle" font-size="11" fill="#a32d2d">断点 B1：核心功能被隐藏</text>
  </g>
  <line x1="410" y1="94" x2="520" y2="160" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 抽屉内核心模块 -->
  <g>
    <rect x="480" y="250" width="80" height="32" rx="6" fill="#faf5ff" stroke="#7f77dd" stroke-width="0.5"/>
    <text x="520" y="266" text-anchor="middle" font-size="12" fill="#3c3489" dominant-baseline="central">驾驶舱</text>
  </g>
  <g>
    <rect x="480" y="296" width="80" height="32" rx="6" fill="#faf5ff" stroke="#7f77dd" stroke-width="0.5"/>
    <text x="520" y="312" text-anchor="middle" font-size="12" fill="#3c3489" dominant-baseline="central">推荐运行</text>
  </g>
  <g>
    <rect x="480" y="342" width="80" height="32" rx="6" fill="#faf5ff" stroke="#7f77dd" stroke-width="0.5"/>
    <text x="520" y="358" text-anchor="middle" font-size="12" fill="#3c3489" dominant-baseline="central">验收安全</text>
  </g>
  <g>
    <rect x="480" y="388" width="80" height="32" rx="6" fill="#faf5ff" stroke="#7f77dd" stroke-width="0.5"/>
    <text x="520" y="404" text-anchor="middle" font-size="12" fill="#3c3489" dominant-baseline="central">控制中心</text>
  </g>
  <line x1="520" y1="200" x2="520" y2="250" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="282" x2="520" y2="296" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="328" x2="520" y2="342" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="374" x2="520" y2="388" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 断点说明 -->
  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="360" height="140" rx="10" fill="#fcebeb" stroke="#e24b4a" stroke-width="0.5"/>
    <text x="12" y="24" font-size="13" font-weight="500" fill="#501313">关键断点</text>
    <text x="12" y="48" font-size="11" fill="#791f1f">B1 测试窗口抽屉隐藏生产功能 → 触达成本 +1 步</text>
    <text x="12" y="70" font-size="11" fill="#791f1f">B2 首页入口过少 → 数据健康/运行/复盘无法直达</text>
    <text x="12" y="92" font-size="11" fill="#791f1f">B3 DashboardPage 单文件承载 7 个视图 → 维护困难</text>
    <text x="12" y="114" font-size="11" fill="#791f1f">B4 Run → Candidate → History 依赖 sessionStorage → 无法深链接</text>
  </g>
</svg>