<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720">
  <defs>
    <style>
      .card { fill:#fff; stroke:#e2e8f0; stroke-width:1.5; rx:10 }
      .card-blue { fill:#eff6ff; stroke:#3b82f6; stroke-width:2 }
      .card-green { fill:#f0fdf4; stroke:#22c55e; stroke-width:2 }
      .card-orange { fill:#fff7ed; stroke:#f97316; stroke-width:2 }
      .card-purple { fill:#faf5ff; stroke:#a855f7; stroke-width:2 }
      .arrow { stroke:#94a3b8; stroke-width:2; fill:none; marker-end:url(#arrowhead2) }
      .arrow-green { stroke:#22c55e; stroke-width:2.5; fill:none; marker-end:url(#arrowhead-green) }
      .arrow-blue { stroke:#3b82f6; stroke-width:2.5; fill:none; marker-end:url(#arrowhead-blue) }
      .title { font-size:15px; font-weight:700; fill:#1e293b; font-family:Inter,sans-serif }
      .section-title { font-size:12px; font-weight:700; fill:#1e293b; font-family:Inter,sans-serif }
      .body { font-size:12px; fill:#334155; font-family:Inter,sans-serif }
      .small { font-size:10px; fill:#64748b; font-family:Inter,sans-serif }
      .step-num { fill:#3b82f6; font-size:13px; font-weight:700; font-family:Inter,sans-serif }
      .badge { fill:#dbeafe; font-size:10px; font-weight:600; fill:#1d4ed8 }
    </style>
    <marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="680" height="44" fill="#f8fafc" rx="10 10 0 0"/>
  <text x="340" y="28" text-anchor="middle" class="title">推荐系统双链路优化设计</text>

  <!-- 链路一：执行推荐 -->
  <text x="40" y="72" class="section-title" fill="#1d4ed8">▌ 链路一：执行推荐（触发 → 运行 → 产出 → 复盘）</text>

  <!-- Step 1 -->
  <rect x="40" y="82" width="280" height="90" class="card-blue"/>
  <text x="60" y="106" class="step-num">①</text>
  <text x="82" y="106" class="body" fill="#1d4ed8">驾驶舱（首页）</text>
  <text x="60" y="128" class="small" fill="#334155">• 查看今日市场状态、数据 readiness</text>
  <text x="60" y="146" class="small" fill="#334155">• 主按钮：运行今日推荐（若未运行）</text>
  <text x="60" y="164" class="small" fill="#334155">• 或：查看今日候选（若已完成）</text>

  <!-- Step 2 -->
  <line x1="320" y1="127" x2="370" y2="127" class="arrow-blue"/>
  <rect x="370" y="82" width="280" height="90" class="card-blue"/>
  <text x="390" y="106" class="step-num">②</text>
  <text x="412" y="106" class="body" fill="#1d4ed8">运行详情页</text>
  <text x="390" y="128" class="small" fill="#334155">• 阶段时间线、进度、心跳</text>
  <text x="390" y="146" class="small" fill="#334155">• 系统自动完成数据健康与验收</text>
  <text x="390" y="164" class="small" fill="#16a34a" font-weight="600">✅ 不再需要用户手动检查</text>

  <!-- Step 3 -->
  <line x1="510" y1="172" x2="510" y2="195" class="arrow-blue"/>
  <rect x="370" y="197" width="280" height="90" class="card-blue"/>
  <text x="390" y="221" class="step-num">③</text>
  <text x="412" y="221" class="body" fill="#1d4ed8">候选解释页</text>
  <text x="390" y="243" class="small" fill="#334155">• 本次运行产出的候选列表</text>
  <text x="390" y="261" class="small" fill="#334155">• 每张卡可直接进入复盘</text>
  <text x="390" y="279" class="small" fill="#16a34a" font-weight="600">✅ URL 参数深链接，不复用 sessionStorage</text>

  <!-- Step 4 -->
  <line x1="510" y1="287" x2="510" y2="310" class="arrow-blue"/>
  <rect x="370" y="312" width="280" height="90" class="card-green"/>
  <text x="390" y="336" class="step-num">④</text>
  <text x="412" y="336" class="body" fill="#15803d">复盘详情页</text>
  <text x="390" y="358" class="small" fill="#334155">• 单票：outcome、收益、误判归因</text>
  <text x="390" y="376" class="small" fill="#334155">• 整次运行：成功率与归因分析</text>
  <text x="390" y="394" class="small" fill="#16a34a" font-weight="600">✅ 支持分享链接 ?recommendation_id=xxx</text>

  <!-- 链路二：回访成功率 -->
  <text x="40" y="442" class="section-title" fill="#15803d">▌ 链路二：回访成功率（概览 → 下钻 → 归因）</text>

  <!-- Step 1 -->
  <rect x="40" y="452" width="280" height="90" class="card-green"/>
  <text x="60" y="476" class="step-num">①</text>
  <text x="82" y="476" class="body" fill="#15803d">驾驶舱（首页）</text>
  <text x="60" y="498" class="small" fill="#334155">• 成功率快报：今日 / 近5日 / 累计</text>
  <text x="60" y="516" class="small" fill="#334155">• 主要误判原因、市场环境分布</text>
  <text x="60" y="534" class="small" fill="#334155">• 点击任一指标可下钻</text>

  <!-- Step 2 -->
  <line x1="320" y1="497" x2="370" y2="497" class="arrow-green"/>
  <rect x="370" y="452" width="280" height="90" class="card-green"/>
  <text x="390" y="476" class="step-num">②</text>
  <text x="412" y="476" class="body" fill="#15803d">历史复盘页（成功率档案）</text>
  <text x="390" y="498" class="small" fill="#334155">• 按日期 / run 分组展示</text>
  <text x="390" y="516" class="small" fill="#334155">• 每行：运行日、标的数、成功率</text>
  <text x="390" y="534" class="small" fill="#334155">• 筛选器：误判 / 原因 / 市场环境</text>

  <!-- Step 3 -->
  <line x1="510" y1="542" x2="510" y2="565" class="arrow-green"/>
  <rect x="370" y="567" width="280" height="68" class="card-green"/>
  <text x="390" y="591" class="step-num">③</text>
  <text x="412" y="591" class="body" fill="#15803d">单次 run 复盘</text>
  <text x="390" y="613" class="small" fill="#334155">• 该次运行的所有推荐与成功率</text>
  <text x="390" y="631" class="small" fill="#334155">• 可继续下钻到单票归因</text>

  <!-- Step 4 -->
  <line x1="510" y1="635" x2="510" y2="658" class="arrow-green"/>
  <rect x="370" y="658" width="280" height="48" class="card-purple"/>
  <text x="390" y="682" class="step-num">④</text>
  <text x="412" y="682" class="body" fill="#7c3aed">单票归因</text>
  <text x="390" y="700" class="small" fill="#334155">触发条件 · 收益 · outcome · 归因分析</text>

  <!-- 底部说明 -->
  <rect x="40" y="660" width="280" height="88" fill="#f8fafc" rx="8" stroke="#22c55e" stroke-width="1.5"/>
  <text x="56" y="686" class="small" fill="#15803d" font-weight="700">链路一关键变化</text>
  <text x="56" y="706" class="small" fill="#334155">• 运行入口是驾驶舱主CTA</text>
  <text x="56" y="724" class="small" fill="#334155">• 验收/数据检查后台自动完成</text>
  <text x="56" y="742" class="small" fill="#334155">• URL参数深链接，刷新不丢失</text>

  <rect x="370" y="714" width="280" height="70" fill="#f8fafc" rx="8" stroke="#22c55e" stroke-width="1.5"/>
  <text x="386" y="738" class="small" fill="#15803d" font-weight="700">链路二关键变化</text>
  <text x="386" y="756" class="small" fill="#334155">• 首页直接展示成功率快报</text>
  <text x="386" y="774" class="small" fill="#334155">• 历史复盘 = 按时间组织的成功率档案</text>
  <text x="386" y="792" class="small" fill="#334155">• 支持导出筛选后的复盘样本</text>
</svg>
