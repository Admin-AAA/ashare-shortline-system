# newsyslog config for ashare launchd logs: rotate at 20MB, keep 7, bzip2. N = no signal (launchd owns the fd);
# p = keep .0 uncompressed so a still-open fd keeps writing to a real file until the next (drain-safe) restart.
# install: sudo cp deploy/newsyslog/ashare.conf /etc/newsyslog.d/ashare.conf
# logfilename                                               [owner:group]  mode count size(KB) when flags
/Users/wangao/Library/Logs/ashare-*.log                     wangao:staff   644  7     20480    *    GNJp
/Users/wangao/Desktop/ashare-shortline-system/backend/logs/*.log wangao:staff 644 7  20480    *    GNJp
