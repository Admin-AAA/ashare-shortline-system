default_entry_mode: next_open
output_count: 6
horizon_days: 5
scoring:
  base: 70
  rules: []
setups:
  - name: 收盘形态确认
    when: "amount_yi > 0"
    score_delta: 0
strategies:
  first_board:
    name: 首板接力
    hypothesis: 首次收盘涨停形成关注度，次日买盘延续；预期提高次日涨停率和净收益胜率。
    rule: T 日收盘涨停且前一交易日未收盘涨停。
  failed_touch:
    name: 触板未封修复
    hypothesis: T 日触板后未封住，次日新增买盘承接卖盘；预期提高次日涨停率和净收益胜率。
    rule: T 日最高价达到涨停价且收盘低于涨停价。
  first_pullback:
    name: 涨停次日阴线回调
    hypothesis: 涨停后的首日回调吸收短期卖盘，下一交易日恢复上涨；预期提高次日涨停率和净收益胜率。
    rule: 前一交易日收盘涨停，T 日收阴且低于前收，T 日未触板。
