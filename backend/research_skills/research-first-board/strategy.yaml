id: research-first-board
name: 首板次日溢价
enabled: false
weight: 1.0
default_entry_mode: next_open
meta:
  author: grokbot
  version: 0.1.0
  holding_days: [1, 3, 5]
  strategy_independence: 0.8
contract:
  type: strategy
  executable: true
  schema_version: 1
require_setup: true
universe:
  include:
    - "amount_yi >= 2"
    - "twenty_cm_risk_gate != 'block'"
  exclude:
    - "is_st == true"
    - "announcement_negative_count > 0"
    - "news_risk_count > 0"
prefilter:
  market:
    include:
      - when: "is_limit_up == true"
        reason: "not_limit_up"
      - when: "limit_up_days20 <= 1"
        reason: "not_first_board"
phases:
  - name: 冰点不打板
    when: "market_sentiment_phase == '冰点'"
    score_cap: 55
    hard_veto: true
setups:
  - name: 低位首板
    when: "is_limit_up == true and limit_up_days20 <= 1 and pos120 <= 70"
    score_delta: 10
    entry_rule: "次日低吸，跌破首板实体中部止损"
scoring:
  base: 50
  rules:
    - when: "limit_up_open_times == 0"
      delta: 5
      reason: 封板未开
    - when: "vol5_20 >= 1.5"
      delta: 4
      reason: 放量首板
    - when: "main_net_inflow_yi > 0"
      delta: 4
      reason: 主力净流入
    - when: "is_main_theme == true"
      delta: 5
      reason: 主线题材首板
    - when: "breakout60 == true"
      delta: 4
      reason: 突破60日高点
    - when: "turnover_rate >= 3 and turnover_rate <= 20"
      delta: 3
      reason: 换手健康
risk:
  rules:
    - when: "upper_shadow_count20 > 6"
      level: high
      flag: 抛压重
      score_delta: -8
