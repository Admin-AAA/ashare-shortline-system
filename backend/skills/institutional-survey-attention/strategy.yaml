# 机构调研关注（研究原型，2026-10-13 Grok Bot）
# 假设：近期有较多基金参与调研、趋势向上、当日温和上涨的股票，机构关注度提升带来短期资金流入。
# 来源：Cheng, Du, Wang & Wang (2019) Do corporate site visits impact stock prices? Contemporary Accounting Research；Barber & Odean (2008) All that glitters, Review of Financial Studies
# 状态：enabled=false；回放用 ASHARE_RESEARCH_EXTRA_SKILLS 临时纳入，按最近 12 个月单策略口径评估。
id: institutional-survey-attention
name: 机构调研关注
enabled: false
weight: 1.0
default_entry_mode: next_open
meta:
  author: grokbot
  style: institutional-attention
  version: 0.1.0
  holding_days: [1, 3, 5]
  strategy_independence: 0.85
  default_preset_groups:
    experiment_institutional_survey_attention:
      weight: 1.0
      sort_order: 10
contract:
  type: strategy
  executable: true
  schema_version: 1
universe:
  include:
    - "amount_yi >= 2"
    - "free_mv_yi >= 30"
    - "turnover_rate >= 1"
    - "turnover_rate <= 10"
    - "twenty_cm_risk_gate != 'block'"
  exclude:
    - "is_st == true"
    - "announcement_negative_count > 0"
    - "news_risk_count > 1"
prefilter:
  market:
    include:
      - when: "survey_count >= 1"
        reason: "no_survey"
      - when: "survey_fund_visitors >= 5"
        reason: "few_funds"
      - when: "ma5 > ma20"
        reason: "no_trend"
      - when: "pct >= 0 and pct <= 5"
        reason: "day_move"
    exclude:
      - when: "chg20 > 30"
        reason: "overextended"
      - when: "max_dd20 < -15"
        reason: "broken"
phases:
  - name: 冰点情绪降权
    when: "market_sentiment_phase == '冰点'"
    score_cap: 60
    hard_veto: false
    risk_flags: ["冰点情绪"]
setups:
  - name: 机构调研关注
    when: "survey_fund_visitors >= 5 and ma5 > ma20"
    score_delta: 10
    entry_rule: "次日开盘介入，高开超过 6% 不追（执行层 gap 闸门）"
    invalid_rule: "跌破信号日低点"
scoring:
  base: 54
  rules:
    - when: "survey_fund_visitors >= 15"
      delta: 5
      reason: 调研基金家数多
    - when: "survey_count >= 2"
      delta: 3
      reason: 多次调研
    - when: "primary_excess20 >= 0"
      delta: 4
      reason: 跑赢行业
    - when: "main_net_inflow_yi > 0"
      delta: 3
      reason: 主力净流入
risk:
  rules:
    - when: "pledge_ratio >= 40"
      level: high
      flag: 高质押
      score_delta: -10
