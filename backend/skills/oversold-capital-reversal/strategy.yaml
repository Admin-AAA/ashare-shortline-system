# 超跌资金反包（研究原型，2026-10-13 Grok Bot）
# 假设：20 日深度回撤后的首根放量阳线 + 主力净流入，代表恐慌盘出清后的资金回补；
# 与现有 6 个顺势/动量策略相关性低，用于弱势与震荡 regime 的分工。
# 状态：enabled=false，仅通过 ASHARE_RESEARCH_EXTRA_SKILLS 进入研究回放；按 hold-out 协议评估后再决定。
id: oversold-capital-reversal
name: 超跌资金反包
enabled: true
weight: 1.0
default_entry_mode: next_open
meta:
  author: grokbot
  style: oversold-reversal
  version: 0.1.0
  holding_days: [1, 3, 5]
  strategy_independence: 0.9
  default_preset_groups:
    formal_opening:
      weight: 0.80
      sort_order: 70
contract:
  type: strategy
  executable: true
  schema_version: 1
require_setup: true  # 未命中 setup 不得凭 base 分进池（防 fill 路径噪声分）
universe:
  include:
    - "amount_yi >= 2"
    - "free_mv_yi >= 20"
    - "turnover_rate >= 1.5"
    - "turnover_rate <= 15"
    - "twenty_cm_risk_gate != 'block'"
  exclude:
    - "is_st == true"
    - "announcement_negative_count > 0"
    - "news_risk_count > 0"
prefilter:
  market:
    include:
      - when: "chg20 <= -12"
        reason: "not_oversold"
      - when: "pct >= 3"
        reason: "no_reversal_candle"
      - when: "vol5_20 >= 1.1"
        reason: "no_volume_confirmation"
    include_any:
      - when: "main_net_inflow_yi > 0"
        reason: "requires_main_inflow"
      - when: "capital_resonance_score >= 55"
        reason: "requires_capital_resonance"
    exclude:
      - when: "max_dd60 < -45"
        reason: "structural_collapse"
      - when: "is_limit_up == false and pct >= 9.5"
        reason: "intraday_spike_without_board"
# 逐策略出场微调（Sprint3 §67，2026-10-16）：利润地板激活 0.8%→3%、锁利比例 0.5→0.3，让反包单多跑一段。
# 单策略面板（前3/线72）重算：近12月 n60 +1.65% PF2.08 MDD−15.0 → +3.03% PF2.58 MDD−12.9；
# 2025-01~10 +0.44→+0.92；W0 +0.07→+0.21；W00 +0.52→+0.83。
exit_overrides:
  activation_gain_pct: 3.0
  profit_lock_ratio: 0.3

# 破买入日最低价出场（Sprint4 §185，2026-10-25）：持仓中收盘 < 买入日最低价 → 当日收盘离场（app/services/entry_low_exit.py）。
# EL_C 预注册通过：R12 +1.438→+1.469 PF1.94→1.99；N3 +1.088→+1.147 PF1.72→1.80 MDD−34.6→−28.3；被改约 43/88 笔。
entry_low_exit:
  mode: close

phases:
  # 涨停反包不做（Sprint3 §72，2026-10-17）：信号日已涨停的反包次日溢价被吃掉。
  # 面板（前3/线72）：12m +3.03→+3.18 PF2.58→2.88 MDD−12.9→−11.3；EXT +0.44→+0.79；W0/W00 不变。
  - name: 涨停反包不做
    when: "is_limit_up == true"
    score_cap: 20
    hard_veto: true
    risk_flags: ["信号日已涨停，反包溢价已兑现"]
  - name: 冰点情绪不抄底
    when: "market_sentiment_phase == '冰点'"
    score_cap: 55
    hard_veto: false
    risk_flags: ["冰点情绪，超跌可能继续超跌"]
  - name: 长上影反包失败
    when: "upper_shadow_count20 > 6"
    score_cap: 50
    hard_veto: true
    risk_flags: ["抛压密集，反包失败率高"]
setups:
  - name: 超跌放量反包
    when: "chg20 <= -12 and pct >= 3 and vol5_20 >= 1.1 and main_net_inflow_yi > 0"
    score_delta: 10
    entry_rule: "次日开盘介入，跌破反包阳线开盘价止损"
    invalid_rule: "次日低开跌破反包阳线实体中部"
scoring:
  base: 50
  rules:
    - when: "chg20 <= -18"
      delta: 6
      reason: 深度超跌，反弹空间更大
    - when: "pct >= 5"
      delta: 6
      reason: 反包力度强
    - when: "is_limit_up == true"
      delta: 4
      reason: 涨停反包
    - when: "vol5_20 >= 1.5"
      delta: 5
      reason: 放量明显
    - when: "main_net_inflow_ratio >= 5"
      delta: 5
      reason: 主力净流入占比高
    - when: "rsi_6 >= 50 and rsi_24 < 50"
      delta: 4
      reason: 短期动能反转、中期仍低位
    - when: "is_main_theme == true"
      delta: 4
      reason: 主线题材内的超跌
    - when: "ma5 < ma20"
      delta: 2
      reason: 均线空头内的首次反攻（非追高）
risk:
  rules:
    - when: "max_dd20 < -30"
      level: high
      flag: 回撤过深，可能存在基本面问题
      score_delta: -8
    - when: "pledge_ratio >= 40"
      level: high
      flag: 高质押超跌
      score_delta: -10
