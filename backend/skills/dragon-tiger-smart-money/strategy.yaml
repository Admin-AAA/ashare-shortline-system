id: dragon-tiger-smart-money
name: 龙虎榜聪明钱接力
enabled: true
weight: 0.6

meta:
  author: system
  style: dragon-tiger-smart-money
  version: 0.1.0
  holding_days: [1, 2, 3]
  strategy_independence: 0.82
  default_preset_groups:
    formal_opening:
      weight: 1.10
      sort_order: 80
    formal_trend_core:
      weight: 1.10
      sort_order: 80

contract:
  type: strategy
  executable: true
  schema_version: 1

universe:
  include:
    - "dragon_tiger_is_on_list == true"
    - "amount_yi >= 2"
    - "free_mv_yi >= 15"
    - "turnover_rate >= 2"
    # 排除当日大跌股（603407 pct=-9.89% 仍给 95 分→亏 -9.18%，D 项恶化根因）
    # 龙虎榜净买不等于该买，当日大跌说明抛压严重，聪明钱也可能被套
    - "pct >= -3"
    # 排除弱趋势低位股（pos20<50）：历史10笔 WR=0%（全量5笔+前瞻5笔），因果：龙虎榜是昨日历史数据，
    # pos20<50=整体趋势偏弱，昨日机构净买不足以扭转弱势趋势，次日大概率继续下跌触发止损
    - "pos20 >= 50"
  exclude:
    - "is_st == true"
    - "announcement_negative_count > 0"

prefilter:
  market:
    # dragon_tiger_is_on_list 已由 inject_dragon_tiger_flags 在 prefilter 前注入（同 limit_up 机制）
    include:
      - when: "dragon_tiger_is_on_list == true"
        reason: "requires_dragon_tiger_list"
    include_any:
      # 2026-09-13 修复（深审 A3-2）：删除 inst_buy_ratio>=0.5 分支。此前该比例被
      # 总净买额代理（净买恒 +1），弱净买(0<net_buy_ratio<0.03)股票借此冒充
      # "机构净买"进入本策略，绕过下方"弱净买观察"cap58 的设计意图。
      # 真实机构净买需 top_inst 席位明细接入后恢复该分支。
      - when: "dragon_tiger_net_buy_ratio >= 0.03"
        reason: "requires_smart_money_net_buy"

phases:
  # 强势多头发散毒区（2026-09-12 LIVE 去重241验证）：dsa_trend_score==30（=trend_status强势多头/均线发散上行）
  # n=17 WR17.6% avg-2.83，逐月全差、chg20<40子集反而0%——形态本身即末端反转。软cap58不hard_veto。
  # 置于phases最前但用 not(...) 让位所有 hard_veto（永不架空否决）。
  - name: 强势多头发散毒区
    when: "(dsa_trend_score == 30) and not (dragon_tiger_net_buy_ratio <= 0) and not (off_high_pct >= -30 and off_high_pct < -15) and not (pos60 > 95 and chg20 > 40)"
    score_cap: 58
    hard_veto: false
    risk_flags: ["强势多头均线发散上行（LIVE 17.6%WR/-2.83avg 末端反转毒区），降权不追"]

  # 短线龙头低分降权（2026-09-12 LIVE 去重241验证）：shortline_leader_score<=35 底三分位逐月全差
  # （5月40/6月0/7月36/8月25/9月21%），对照>52逐月50-69%。非龙头缺接力，软cap62温和降权。
  # 置于phases最前，not(...) 让位所有 hard_veto（永不架空否决）。
  - name: 短线龙头低分降权
    when: "(shortline_leader_score > 0 and shortline_leader_score <= 35) and not (dragon_tiger_net_buy_ratio <= 0) and not (off_high_pct >= -30 and off_high_pct < -15) and not (pos60 > 95 and chg20 > 40)"
    score_cap: 62
    hard_veto: false
    risk_flags: ["短线龙头分<=35（非龙头缺接力，低桶逐月全差），温和降权"]

  - name: 弱市非主线非龙头毒区
    when: "market_regime == '弱势' and is_main_theme == false and is_shortline_leader_candidate == false"
    score_cap: 58
    hard_veto: false
    risk_flags: ["弱市非主线非龙头（LIVE 29输9赢），龙虎榜无板块梯队庇护"]

  - name: 龙虎榜净卖出回避
    when: "dragon_tiger_net_buy_ratio <= 0"
    score_cap: 30
    hard_veto: true
    risk_flags: ["龙虎榜净卖出，主力出逃"]

  # 距高点回撤15%~30%断裂区（毒区）：个股距20日高点回撤15%~30%，属上升趋势破位/高位派发区间，
  #   非健康回踩（健康回踩为 off_high>-15；极端超跌 off_high<-30 反有企稳反弹，WR100%）。
  #   LIVE formal 全策略该区间 n=28 netWR=32.1% netPL=0.44 totNet=-62.4（净负）；跨 8 个交易日分布
  #   （06-03/06-08/07-06~07-09/07-16），非单日 regime 噪声。本策略(n=7, totNet=-40.63, WR0%)与
  #   limit-up-reseal(n=7, totNet=-19.75)集中产出该区间。
  # 因果：龙虎榜接力赌次日延续，但 off_high∈[-30,-15]=已脱离上升趋势、处下跌中继派发区，即便当日上榜
  #   也是下跌途中的一次反抽，次日无持续买盘即回落触发止损。与"上升趋势中健康回踩"(真alpha)相反。
  # 反事实验证（全量 LIVE rec_ n=467）：剔除该区间 → 净收益率 +62.4（delta_net_return>0，过拟合护栏通过）；
  #   剩余 n=439 netWR 67.7%→69.9%、netPL 2.15→2.47（双升）。仅作用于本策略（chao-gu 等策略有意买深跌，不动）。
  - name: 距高点回撤15%-30%断裂区(毒区)
    when: "off_high_pct >= -30 and off_high_pct < -15"
    score_cap: 50
    hard_veto: true
    risk_flags: ["距20日高点回撤15%~30%:上升趋势破位/派发区，非健康回踩"]

  # 抛物线上冲追顶毒区：60日高位(pos60>95) + 20日暴涨(chg20>40) = 已处抛物线末端，龙虎榜净买接的是最后一棒
  # LIVE 验证（2026-07-11 D项残留毒区归因，dragon-tiger-smart-money 去重样本 n=44）：
  #   pos60>95 & chg20>40: n=3 WR=33.3%(2败/1赢) vs 其余 n=41 WR=78.0%(32赢/9败)
  #   反事实剔除 ΔWR +3.0pp（净正，误伤比33.3%）。代表样本 603650 彤程新材 chg20=85.76 pos60=95.5 → -5.69% 止损
  #   因果：龙虎榜"聪明钱接力"赌次日延续，但 pos60>95(接近60日最高) + chg20>40(20日已暴涨40%+) =
  #     股票已处抛物线末端，任何净买都是接最后一棒，次日回调即触发止损。与"涨停日龙虎榜"(真alpha)逻辑相反。
  - name: 抛物线上冲追顶毒区
    when: "pos60 > 95 and chg20 > 40"
    score_cap: 50
    hard_veto: true
    risk_flags: ["60日高位+20日暴涨(抛物线上冲末端)，龙虎榜接力接最后一棒"]

  # 弱市大跌日龙虎榜诱多毒区：弱市+当日大跌(pct<-5) → cap 68（低于 score_line 72）
  # LIVE 验证（2026-07 第148轮 D项最大亏损-9.18%根因，全策略 LIVE formal 去重）：
  #   dragon-tiger 弱市 & pct<-5: n=4(去重) WR=25% avg=-1.53% min=-9.18%（603407 -9.18% 最大亏损源）
  #   对照 dragon-tiger 涨停日(pct>=9.5): n=19 WR=68.4% avg=+1.58%（涨停龙虎榜是真聪明钱 alpha）
  # 因果：龙虎榜"聪明钱接力"赌次日延续，但弱市大跌日(pct<-5)的龙虎榜净买多为机构对倒/诱多接盘
  #   （大跌日散户恐慌，龙虎榜净买≠聪明钱），次日继续跌。与涨停日龙虎榜（真追板）逻辑相反。
  # 用 pct<-5 原始因子（prefilter 阶段可用，_build_stock_from_bars 产出），不误伤涨停日 alpha。
  - name: 弱市大跌日龙虎榜诱多毒区
    when: "market_regime == '弱势' and pct < -5"
    score_cap: 68
    hard_veto: false
    risk_flags: ["弱市大跌日龙虎榜净买多为诱多接盘，非聪明钱接力"]

  - name: 弱净买观察
    when: "dragon_tiger_net_buy_ratio > 0 and dragon_tiger_net_buy_ratio < 0.03"
    score_cap: 58
    hard_veto: false
    risk_flags: ["净买偏弱，不追"]
  - name: 强聪明钱接力
    when: "dragon_tiger_net_buy_ratio >= 0.05"
    score_cap: 95
    hard_veto: false
setups:
  - name: 一线游资净买接力
    when: "dragon_tiger_net_buy_ratio >= 0.05"
    score_delta: 10
    entry_mode: next_open
    entry_rule: "龙虎榜净买占成交额≥5%；次日开盘可交易且相对推荐价高开不超过10%时介入"
    invalid_rule: "低开低走跌破榜单日最低价"
  # 2026-09-13 修复（深审 A3-2）：删除"机构净买确认"setup。
  # dragon_tiger_inst_buy_ratio 此前被总净买额代理（净买恒 +1），该 setup 实际
  # 等价于弱净买确认，冒充机构席位身份；top_inst 席位明细接入前不设机构类 setup。

scoring:
  base: 45
  rules:
    # ── 聪明钱强度（核心 alpha，已回测验证）──
    - when: "dragon_tiger_net_buy_ratio >= 0.10"
      delta: 12
      reason: 龙虎榜净买占成交额≥10%(极强聪明钱)
    - when: "dragon_tiger_net_buy_ratio >= 0.05"
      delta: 18
      reason: 净买占成交额≥5%(强聪明钱,WR85.6%)
    - when: "dragon_tiger_net_buy_ratio >= 0.03 and dragon_tiger_net_buy_ratio < 0.05"
      delta: 6
      reason: 净买占比中等
    - when: "dragon_tiger_net_buy_ratio <= 0"
      delta: -20
      reason: 龙虎榜净卖出(主力出逃)
    # 2026-09-13 修复（深审 A3-2）：删除 inst_buy_ratio>=0.5(+6) 规则——该比例被
    # 总净买额代理（净买恒 +1），实为净买方向重复计分，冒充聪明钱席位占比。
    # top_inst 席位明细接入后再恢复真实的机构/游资占比规则。
    # ── 资金同向确认 ──
    - when: "main_net_inflow_yi > 0.3"
      delta: 5
      reason: 主力日内同向流入
    - when: "capital_resonance_signal == '主力共振'"
      delta: 8
      reason: 超大单主力共振
    - when: "is_main_theme == true"
      delta: 6
      reason: 主线题材龙虎榜

risk:
  rules:
    - when: "dragon_tiger_net_buy_ratio <= 0"
      level: high
      flag: 龙虎榜净卖出
    - when: "turnover_rate > 12"
      level: high
      flag: 高换手风险
    - when: "announcement_negative_count > 0"
      level: medium
      flag: 负面公告
