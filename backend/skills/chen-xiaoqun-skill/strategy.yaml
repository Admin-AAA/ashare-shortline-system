id: chen-xiaoqun-skill
name: 陈小群龙头战法
enabled: true
weight: 1.12

meta:
  author: system
  style: shortline
  version: 0.2.0
  holding_days: [1, 3, 5]
  strategy_independence: 0.75
  default_preset_groups:
    formal_opening:
      weight: 1.05
      sort_order: 10
    formal_trend_core:
      weight: 1.15
      sort_order: 10

contract:
  type: strategy
  executable: true
  schema_version: 1

universe:
  include:
    - "amount_yi >= 3"
    - "free_mv_yi >= 20"
  exclude:
    - "announcement_negative_count > 0"
    - "is_st == true"

prefilter:
  market:
    include:
      - when: "turnover_rate >= 2"
        reason: "turnover_too_low"
      - when: "turnover_rate <= 10"
        reason: "turnover_too_high"
      - when: "max_dd20 >= -18"
        reason: "drawdown_too_large"
      - when: "upper_shadow_count20 <= 5"
        reason: "upper_shadow_too_many"
    include_any:
      - when: "is_main_theme == true and breakout20 == 1"
        reason: "requires_main_breakout"
      - when: "is_main_theme == true and pct >= 1 and off_high_pct >= -6"
        reason: "requires_main_strength"
      - when: "industry_capacity_like_count >= 2 and pct >= 2 and amount_yi >= 4"
        reason: "requires_sector_leadership"
    exclude:
      - when: "pos60 > 97 and dist60 > 30"
        reason: "late_acceleration"
      - when: "turnover_rate > 9 and pct < 0"
        reason: "distribution_risk"

phases:
  - name: 退潮
    when: "(dist20 < 0 and chg20 < 0) or max_dd20 < -15"
    score_cap: 35
    hard_veto: true
    risk_flags: ["退潮不开仓"]

  - name: 加速末期
    when: "(upper_shadow_count20 >= 5 and pos60 > 95) or (turnover_rate > 9 and vol5_20 < 0.85) or (dist60 > 40 and pos60 > 98)"
    score_cap: 45
    hard_veto: false
    risk_flags: ["加速末期不追高"]

  - name: 加速初期
    when: "dist20 >= 15 and chg20 > 25 and eff20 > 0.4 and turnover_rate < 8 and upper_shadow_count20 <= 3"
    score_cap: 88
    hard_veto: false
    risk_flags: ["注意换手确认"]

  - name: 高潮期
    when: "market_sentiment_phase == '高潮'"
    score_cap: 95
    hard_veto: false
    risk_flags: ["高潮期注意分歧"]

  - name: 启动
    when: "dist20 < 15 and chg20 < 25 and pos20 < 85"
    score_cap: 92
    hard_veto: false

setups:
  - name: 分歧转一致
    when: "breakout20 == true and turnover_rate >= 3 and turnover_rate <= 8 and upper_shadow_count20 <= 3"
    score_delta: 7  # alpha decay: breakout20 r=+0.07→-0.20, reduced from 14
    entry_rule: "放量突破昨日高点或20日平台，且不冲高回落"
    invalid_rule: "跌回突破平台并收不回"

  - name: 弱转强
    when: "off_high_pct < -2 and pct > 1 and vol5_20 >= 1"
    score_delta: 10
    entry_rule: "放量修复分歧日高点"
    invalid_rule: "失守分歧日低点"

  - name: 龙头启动
    when: "is_shortline_leader_candidate == true and breakout20 == true and turnover_rate >= 2 and turnover_rate <= 10"
    score_delta: 5  # alpha decay: breakout20 + leader both decaying, reduced from 12
    entry_rule: "龙头候选放量突破，关注板块联动"
    invalid_rule: "板块退潮或龙头炸板"

scoring:
  base: 40
  rules:
    # ── 主线与行业 ──
    - when: "is_main_theme == true"
      delta: 18
      reason: 主线行业
    - when: "is_main_theme == false"
      delta: -15
      reason: 非主线降权
    - when: "primary_excess20 > 15"
      delta: 10
      reason: 20日超额收益极强
    - when: "primary_excess20 > 5"
      delta: 5
      reason: 20日超额收益偏强
    - when: "primary_excess20 < -10"
      delta: -6
      reason: 20日超额收益偏弱
    # ── 换手健康度 (分层) ──
    - when: "turnover_rate >= 3 and turnover_rate <= 6"
      delta: 8
      reason: 换手黄金区间
    - when: "turnover_rate >= 6 and turnover_rate <= 8"
      delta: 4
      reason: 换手适中
    - when: "turnover_rate >= 8 and turnover_rate <= 10 and is_shortline_leader_candidate == true"
      delta: 3
      reason: 龙头可接受偏高换手
    - when: "turnover_rate < 1.5"
      delta: -6
      reason: 换手过低，关注度不足
    - when: "turnover_rate > 10 and is_shortline_leader_candidate == false"
      delta: -8
      reason: 非龙头高换手疑为主力出货
    # ── 龙头识别 (放大) ──
    - when: "is_shortline_leader_candidate == true"
      delta: 16
      reason: 龙头候选
    - when: "is_shortline_leader_candidate == true and is_limit_up == true"
      delta: 8
      reason: 涨停龙头确认
    - when: "is_shortline_leader_candidate == true and is_main_theme == true"
      delta: 6
      reason: 主线龙头共振
    # ── 主力共识 (放大) ──
    - when: "capital_resonance_signal == '主力共振'"
      delta: 12
      reason: 超大单净流入+散户净流出
    - when: "capital_resonance_signal == '资金配合'"
      delta: 8
      reason: 主力与超大单共振流入
    - when: "capital_resonance_signal == '资金背离'"
      delta: -12
      reason: 散户主导，缺乏主力共识
    - when: "main_net_inflow_yi > 0.5"
      delta: 5
      reason: 主力日内净流入超5kw
    - when: "main_net_inflow_ratio > 8"
      delta: 4
      reason: 主力净流入占比超8%
    # ── 龙虎榜买榜质量 ──
    - when: "dragon_tiger_is_on_list == true and dragon_tiger_buy_dispersion == '集中'"
      delta: 8
      reason: 龙虎榜买榜集中
    - when: "dragon_tiger_is_on_list == true and dragon_tiger_buy_dispersion == '分散'"
      delta: -6
      reason: 龙虎榜买榜分散，主力分歧
    - when: "dragon_tiger_is_on_list == true and dragon_tiger_inst_buy_ratio >= 0.5"
      delta: 6
      reason: 机构净买入占比过半
    - when: "dragon_tiger_is_on_list == true and dragon_tiger_inst_buy_ratio >= 0.7"
      delta: 4
      reason: 机构净买入高度集中
    # ── 市场情绪 (分层) ──
    - when: "market_sentiment_phase == '高潮'"
      delta: 6
      reason: 市场情绪高潮
    - when: "market_sentiment_phase == '活跃'"
      delta: 3
      reason: 市场情绪活跃
    - when: "market_sentiment_phase == '冰点'"
      delta: -10
      reason: 市场情绪冰点，降权
    - when: "limit_up_overheat_score >= 70"
      delta: -8
      reason: 涨停情绪过热，降低追高分
    - when: "twenty_cm_risk_gate == 'block'"
      delta: -15
      reason: 20cm 风险闸门阻断
    # ── 价格位置 (新增) ──
    - when: "pos20 > 90"
      delta: -5
      reason: 20日高位追涨风险
    - when: "pos60 > 95"
      delta: -7
      reason: 60日极高位
    - when: "pos20 < 30 and chg20 > 0"
      delta: 4
      reason: 低位企稳
    # ── 跌幅与风险 (新增) ──
    - when: "max_dd20 < -20"
      delta: -8
      reason: 20日最大回撤过大
    - when: "off_high_pct < -15"
      delta: -6
      reason: 距20日高点太远

risk:
  rules:
    - when: "upper_shadow_count20 >= 4"
      level: medium
      flag: 上影线偏多
    - when: "turnover_rate > 12"
      level: high
      flag: 高换手风险
    - when: "capital_resonance_signal == '资金背离'"
      level: medium
      flag: 散户主导无主力共识
    - when: "dragon_tiger_is_on_list == true and dragon_tiger_buy_dispersion == '分散'"
      level: medium
      flag: 龙虎榜买榜分散
    - when: "market_sentiment_phase == '冰点' and is_shortline_leader_candidate == false"
      level: high
      flag: 冰点期非龙头不参与
    - when: "limit_up_overheat_score >= 70"
      level: medium
      flag: 涨停过热，追高仓位降档
    - when: "twenty_cm_risk_gate == 'block'"
      level: high
      flag: 20cm 风险闸门阻断
