# 龙虎榜净买次日跟随（研究原型，2026-10-13 Grok Bot）
# 假设：前一交易日上龙虎榜且净买入较大、当日未继续大涨也未破位的股票，跟随资金次日开盘介入。
# 来源：实战社区常用的龙虎榜净买入次日跟踪思路（东方财富龙虎榜数据中心 https://data.eastmoney.com/stock/lhb.html ）；仓库 L-135/L-139/L-163；本仓库龙虎榜按 T-1 可见
# 状态：enabled=false；回放用 ASHARE_RESEARCH_EXTRA_SKILLS 临时纳入，按最近 12 个月单策略口径评估。
id: dragon-tiger-net-buy-followup
name: 龙虎榜净买次日跟随
enabled: false
weight: 1.0
default_entry_mode: next_open
meta:
  author: grokbot
  style: dragon-tiger
  version: 0.1.0
  holding_days: [1, 3, 5]
  strategy_independence: 0.85
  default_preset_groups:
    experiment_dragon_tiger_net_buy_followup:
      weight: 1.0
      sort_order: 10
contract:
  type: strategy
  executable: true
  schema_version: 1
universe:
  include:
    - "amount_yi >= 2"
    - "turnover_rate <= 25"
    - "twenty_cm_risk_gate != 'block'"
  exclude:
    - "is_st == true"
    - "announcement_negative_count > 0"
    - "news_risk_count > 1"
prefilter:
  market:
    include:
      - when: "dragon_tiger_is_on_list == true"
        reason: "not_on_list"
      - when: "dragon_tiger_net_amount_yi >= 0.3"
        reason: "net_buy_small"
      - when: "pct >= -3 and pct <= 6"
        reason: "day_move"
    exclude:
      - when: "max_dd20 < -20"
        reason: "broken"
      - when: "limit_up_consecutive_days >= 4"
        reason: "too_high_board"
phases:
  - name: 冰点情绪降权
    when: "market_sentiment_phase == '冰点'"
    score_cap: 60
    hard_veto: false
    risk_flags: ["冰点情绪"]
setups:
  - name: 龙虎榜净买次日跟随
    when: "dragon_tiger_is_on_list == true and dragon_tiger_net_amount_yi >= 0.3"
    score_delta: 10
    entry_rule: "次日开盘介入，高开超过 6% 不追（执行层 gap 闸门）"
    invalid_rule: "跌破信号日低点"
scoring:
  base: 54
  rules:
    - when: "dragon_tiger_net_amount_yi >= 1"
      delta: 5
      reason: 净买入大
    - when: "dragon_tiger_net_buy_ratio >= 0.1"
      delta: 4
      reason: 净买占比高
    - when: "is_main_theme == true"
      delta: 4
      reason: 主线题材
    - when: "main_net_inflow_yi > 0"
      delta: 3
      reason: 主力净流入
risk:
  rules:
    - when: "pledge_ratio >= 40"
      level: high
      flag: 高质押
      score_delta: -10
