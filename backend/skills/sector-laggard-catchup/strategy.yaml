# 主线板块补涨（研究原型，2026-10-13 Grok Bot）
# 假设：主线板块内相对强度仍落后（20 日超额不高）、位置不高、当日放量启动的个股，有补涨机会。
# 状态：enabled=false，仅通过 ASHARE_RESEARCH_EXTRA_SKILLS 进入研究回放，按 walk-forward 协议评估。
id: sector-laggard-catchup
name: 主线板块补涨
enabled: false
weight: 1.0
default_entry_mode: next_open
meta:
  author: grokbot
  style: sector-rotation
  version: 0.1.0
  holding_days: [1, 3, 5]
  strategy_independence: 0.8
  default_preset_groups:
    experiment_sector_laggard_catchup:
      weight: 1.0
      sort_order: 10
contract:
  type: strategy
  executable: true
  schema_version: 1
universe:
  include:
    - "amount_yi >= 2"
    - "free_mv_yi >= 20"
    - "turnover_rate >= 1.5"
    - "turnover_rate <= 12"
    - "is_main_theme == true"
    - "twenty_cm_risk_gate != 'block'"
  exclude:
    - "is_st == true"
    - "announcement_negative_count > 0"
    - "news_risk_count > 1"
prefilter:
  market:
    include:
      - when: "primary_excess20 <= 5"
        reason: "already_leading"
      - when: "pos60 <= 75"
        reason: "position_too_high"
      - when: "pct >= 2 and pct <= 7"
        reason: "no_catchup_move"
      - when: "vol5_20 >= 1.2"
        reason: "no_volume"
      - when: "sector_ladder_completeness_score >= 60"
        reason: "sector_not_strong"
    exclude:
      - when: "max_dd20 < -20"
        reason: "trend_broken"
phases:
  - name: 弱市不补涨
    when: "market_regime == '弱势'"
    score_cap: 58
    hard_veto: false
    risk_flags: ["弱市板块轮动失败率高"]
setups:
  - name: 主线补涨
    when: "is_main_theme == true and primary_excess20 <= 5 and pct >= 2 and vol5_20 >= 1.2"
    score_delta: 10
    entry_rule: "次日开盘介入"
    invalid_rule: "跌破启动阳线开盘价"
scoring:
  base: 50
  rules:
    - when: "sector_ladder_completeness_score >= 75"
      delta: 6
      reason: 板块梯队完整
    - when: "ma5 > ma10 and ma10 > ma20"
      delta: 4
      reason: 多头排列
    - when: "breakout20 == 1"
      delta: 4
      reason: 突破平台
    - when: "main_net_inflow_yi > 0"
      delta: 4
      reason: 主力净流入
    - when: "rsi_12 >= 50 and rsi_12 <= 70"
      delta: 3
      reason: 动能健康未过热
risk:
  rules:
    - when: "upper_shadow_count20 > 5"
      level: medium
      flag: 上影线多
      score_delta: -5
