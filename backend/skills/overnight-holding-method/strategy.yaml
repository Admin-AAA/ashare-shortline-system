# ⚠️ SELF-IMPROVE FLAG: 低胜率策略 (winrate=35.0% n=20 / post-veto 25% n=12, 标记日期=2026-07-10)
# 失败归因(T3.6 第157轮+): 弱市×追高毒区(14/15 历史推荐 regime=弱势) + 中期空头死猫跳(bias_ma20<0)
#   + cold_chase 毒区(603268/000636 多笔)；universe pct∈[3,5] 本身即在追高区。
# 已修复: 弱市硬否决 phase(market_regime=='弱势'→hard_veto) + universe.dist20>=0(排除死猫跳)。
# 权重 1.0→0.5(第157轮)→0.35 地板(本轮): post-veto 样本 WR 不升反降至 25%(n=12)，
#   弱市否决未救回 overnight，连续 2 轮验证 WR<45% 且归因无解 → 按第157轮计划降到 0.35 地板；
#   0.35 为最低权重档(high-range 0.35 / limit-up 0.45)，进一步降权或下线留待样本累积后再判。
id: overnight-holding-method
name: 隔夜持股法
enabled: true
weight: 0.35

meta:
  author: system
  style: overnight-shortline
  version: 0.1.0
  holding_days: [1]
  strategy_independence: 0.9
  default_preset_groups:
    formal_opening:
      weight: 0.85
      sort_order: 80
    formal_trend_core:
      weight: 0.90
      sort_order: 80
    formal_intraday:
      weight: 1.0
      sort_order: 10
  backtest_adapter:
    module: app.services.overnight_holding_service
    default_action: run
    actions:
      run:
        function: run_overnight_holding_backtest
      preview_minute_gate:
        function: preview_minute_gap_remediation
      remediate_minute_gaps:
        function: remediate_minute_gaps
        task_run:
          task_id: manual_minute_gap_remediation
          task_name: 手动分钟补数
          task_type: data_backfill
          result_extra:
            remediation_type: minute_gap

contract:
  type: strategy
  executable: true
  schema_version: 1

universe:
  include:
    - "pct >= 3"
    - "pct <= 5"
    - "turnover_rate >= 5"
    - "turnover_rate <= 10"
    - "twenty_cm_risk_gate != 'block'"
    # 中期趋势方向过滤：隔夜持股赌次日趋势延续，股价在20日均线下方（dist20<0，
    # 即 bias_ma20<0）的当日反弹是死猫跳，次日大概率继续跌。
    # 失败归因：000636/000815/300604 等 dist20<0 票隔夜追入全部 -5.7%~-0.2% 失败。
    # 用 dist20 而非 bias_ma20：prefilter 阶段 stock 已含 dist20（_build_stock_from_bars 产出），
    # bias_ma20 是 build_features 后置字段，prefilter 阶段缺失会被 _coerce(None)→0.0 静默绕过。
    - "dist20 >= 0"
    # 短期位置过滤（pos20>=50）：20日位置偏低的股票隔夜 WR 持续恶化
    # 全量: pos20<50 WR=66.7% vs pos20>=50 WR=91.7%（+25pp），前瞻>=07-06: pos20<50 WR=55.6%（低于基线61.5%）
    # 因果：隔夜持股赌次日惯性延续，pos20<50=20日内价格处于下半段，短期动量偏弱，次日无延续资金
    # 注：dragon-tiger 也加了同样的 pos20>=50 护栏，与本策略逻辑一致
    - "pos20 >= 50"
  exclude:
    - "is_st == true"

prefilter:
  market:
    # prefilter 只用盘后立即可得的原始字段;资本共振/涨停过热等衍生分
    # 在 build_features 之后由 setup(capital_resonance_score>=45) / risk(limit_up_overheat_score>=70) 精确确认
    include:
      - when: "limit_up_days20 >= 1"
        reason: "requires_recent_limit_up"
      - when: "turnover_rate >= 5"
        reason: "turnover_too_low"
      - when: "turnover_rate <= 10"
        reason: "turnover_too_high"

phases:
  # 弱市隔夜毒区硬否决：overnight 入场区间 pct∈[3,5] 恰是弱市半吊子追高毒区
  # LIVE 验证（2026-07 第144轮 D项恶化失败归因闭环，全策略 LIVE formal）：
  #   弱势 & pct∈[3,5]: n=64 WR=23.4% avg=-1.52% PL=0.10（3 个月稳定毒区）
  #   overnight 弱势全样本: n=19 WR=36.8% avg=-0.31%（3 轮修复后仍低于 50%）
  #   对照 弱势 pct<0(超跌) WR=61.4% | pct>=9(涨停惯性) WR=69.7% —— 唯独 3-5 毒区
  # 因果：隔夜持股赌次日趋势延续，但弱市 up_ratio<0.35 无延续资金；3-5% 涨幅既无超跌安全垫
  #   也无涨停封板惯性，次日低开闷杀（603268/000636/000815 等 -5.7%~-5.69% 止损高发）。
  #   第142-143轮 dist20>=0 / 中期空头过滤只能拦死猫跳，拦不住多头高位隔夜补跌。
  # 弱市下 overnight 入场区间整体是毒区，hard_veto 直接否决；alpha 留给超跌均值回归策略。
  - name: 弱市隔夜毒区
    when: "market_regime == '弱势'"
    score_cap: 20
    hard_veto: true
    risk_flags: ["弱市隔夜追高确定性亏损（入场区间pct3-5即半吊子追高毒区），硬否决"]

  # 震荡市隔夜毒区（第 N+1 轮 D 攻击，前瞻样本定位）：
  # 前瞻(>=2026-07-09) overnight 17 笔失败里 8 笔 gap_roundtrip（过山车），6 笔来自震荡市：
  #   300726/600601/301308/603290/600460/603989 全 07-09 震荡市 stop_loss_hit，avg_max=3.8%（
  #   盘中冲高 3-5% 未锁利，次日反向低开闷杀 -5.7%~-5.9%）。
  # 全量反事实：震荡市 overnight n=9 WR=33.3% avg=-2.81%（远低于基线 61.5%），与弱市同属
  #   "无次日延续资金"毒区（隔夜赌次日惯性，震荡市次日反向低开即死）。veto 震荡后 overnight
  #   全量 WR 33.3%→60.9%、净均收益 -2.81%→+0.84%。3 笔震荡成功(take_profit+11.4%/+4.8%,
  #   trailing+1.85%)收益 +12.86% < 6 笔失败损失 -34.14%，净 veto 正向。
  # 样本量提示：震荡仅 9 笔（小样本），但 33.3%/avg-2.81% 信号一致 + 因果同弱市机制。
  #   持续前瞻验证；若样本累积后震荡 WR 回升 >45% 再松 veto。
  - name: 震荡市隔夜毒区
    when: "market_regime == '震荡'"
    score_cap: 20
    hard_veto: true
    risk_flags: ["震荡市隔夜无次日延续资金，次日反向低开闷杀毒区（前瞻6笔全-5.7%~-5.9%止损），硬否决"]

  - name: 尾盘观察
    when: "pct >= 3 and pct <= 5"
    score_cap: 100
    hard_veto: false

setups:
  - name: 隔夜尾盘确认
    when: "pct >= 3 and pct <= 5 and turnover_rate >= 5 and turnover_rate <= 10 and capital_resonance_score >= 45"
    score_delta: 10
    entry_rule: "14:30 后新高回踩分时均线不破再介入"
    invalid_rule: "回踩跌破分时均线或次日早盘承接弱"

scoring:
  base: 45
  rules:
    - when: "capital_resonance_score >= 60"
      delta: 10
      reason: 尾盘资金承接较强
    - when: "sector_ladder_completeness_score >= 50"
      delta: 6
      reason: 板块梯队有承接
    - when: "limit_up_overheat_score < 45"
      delta: 6
      reason: 涨停情绪未明显过热
    - when: "twenty_cm_risk_gate == 'caution'"
      delta: -8
      reason: 20cm 隔夜波动需降权

risk:
  rules:
    - when: "pct > 5"
      level: high
      flag: 涨幅超出隔夜策略区间
    - when: "limit_up_overheat_score >= 70"
      level: high
      flag: 涨停过热，不做隔夜追高
    - when: "twenty_cm_risk_gate == 'block'"
      level: high
      flag: 20cm 风险闸门阻断隔夜
