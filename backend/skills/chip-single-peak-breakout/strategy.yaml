id: chip-single-peak-breakout
name: 筹码单峰突破
enabled: true
weight: 1.0

meta:
  author: system
  style: chip-breakout
  version: 0.1.0
  holding_days: [2, 3, 5]
  strategy_independence: 0.72
  default_preset_groups:
    formal_opening:
      weight: 0.80
      sort_order: 65
    formal_chip_core:
      weight: 1.0
      sort_order: 65
    experiment_chip:
      weight: 1.0
      sort_order: 15

contract:
  type: strategy
  executable: true
  schema_version: 1

# chip_concentration 是 90% 筹码集中度（与 concentration_90 同源，已验证符合 evaluator 白名单）。
# 因果链：chip_concentration>=20 即上方 90% 筹码压缩在极窄价格带 -> 套牢盘极轻 -> 放量突破阻力小。
universe:
  include:
    - "amount_yi >= 3"
    - "turnover_rate >= 1"
    - "turnover_rate <= 8"
    - "chg20 >= 3"
    - "pos60 >= 45"
    - "off_high_pct >= -12"
    - "twenty_cm_risk_gate != 'block'"
  exclude:
    - "is_st == true"
    - "announcement_negative_count > 0"
    - "news_risk_count > 1"

prefilter:
  market:
    # chip_concentration 缺失/发散时值为 0，自然不过滤阈值
    # 第 N+18 轮 T5: >=18 → >=20, 与 setups 阈值一致(避免过 prefilter 但 setup 空的低质量推荐)
    include:
      - when: "max_dd20 >= -14"
        reason: "drawdown_too_large"
      - when: "chip_concentration >= 20"
        reason: "chip_loose"
    include_any:
      # 核心模式：单峰密集 + 平台/新高突破 + 放量确认（历史验证 WR 83.4% / n=193）
      - when: "chip_concentration >= 20 and (breakout20 == 1 or breakout60 == 1) and vol5_20 >= 1.1"
        reason: "requires_chip_tight_breakout_vol"
      # 极 tight 单峰 + 突破（放宽放量要求）
      - when: "chip_concentration >= 22 and (breakout20 == 1 or breakout60 == 1)"
        reason: "requires_chip_tighter_breakout"
    exclude:
      - when: "dist20 > 18 and rsi_12 > 72"
        reason: "overheated"
      - when: "off_high_pct < -12 and pct < 0"
        reason: "trend_broken"
      - when: "vol5_20 >= 1.8 and pct < 0"
        reason: "volume_down_not_breakout"

phases:
  - name: 破位回避
    when: "max_dd20 < -14 or (off_high_pct < -12 and pct < 0)"
    score_cap: 32
    hard_veto: true
    risk_flags: ["趋势支撑破坏，不做单峰突破"]

  - name: 过热等待
    when: "dist20 > 18 and rsi_12 > 72"
    score_cap: 55
    hard_veto: false
    risk_flags: ["突破已过热，等待回踩"]

  - name: 单峰突破确认
    when: "chip_concentration >= 20 and (breakout20 == 1 or breakout60 == 1) and vol5_20 >= 1.1 and dsa_trend_score >= 18"
    score_cap: 90
    hard_veto: false

setups:
  - name: 单峰放量突破
    when: "chip_concentration >= 20 and (breakout20 == 1 or breakout60 == 1) and vol5_20 >= 1.1 and ma5 >= ma10"
    score_delta: 12
    entry_rule: "筹码单峰密集且放量突破，次日不追高，等回踩确认或分时转强介入"
    invalid_rule: "跌破密集区上沿且放量，单峰结构破坏"

  - name: 单峰缩量企稳再突破
    when: "chip_concentration >= 22 and breakout20 == 1 and dsa_support_score >= 8"
    score_delta: 9
    entry_rule: "极 tight 单峰 + 突破后回踩不破，等止跌阳线确认"
    invalid_rule: "放量跌破密集区"

  - name: 多头结构单峰
    when: "ma5 > ma10 and ma10 > ma20 and chip_concentration >= 20 and capital_resonance_score >= 55"
    score_delta: 6
    entry_rule: "多头排列 + 单峰筹码 + 资金共振，等突破放量确认"
    invalid_rule: "多头结构破坏或资金流出"

scoring:
  base: 42
  rules:
    - when: "chip_concentration >= 20"
      delta: 10
      reason: 筹码单峰密集（上方套牢轻）
    - when: "chip_concentration >= 24"
      delta: 6
      reason: 单峰极 tight
    - when: "(breakout20 == 1 or breakout60 == 1)"
      delta: 8
      reason: 平台/新高突破启动
    - when: "vol5_20 >= 1.1 and (breakout20 == 1 or breakout60 == 1)"
      delta: 7
      reason: 突破放量确认
    - when: "ma5 > ma10 and ma10 > ma20"
      delta: 8
      reason: 多头排列
    - when: "dsa_trend_score >= 26"
      delta: 7
      reason: 趋势评分高
    - when: "dsa_support_score >= 10"
      delta: 6
      reason: 支撑有效
    - when: "dsa_macd_score >= 8"
      delta: 5
      reason: MACD 多头
    - when: "capital_resonance_score >= 60"
      delta: 6
      reason: 资金承接
    - when: "off_high_pct >= -8"
      delta: 4
      reason: 突破位于高位基部
    - when: "is_main_theme == true"
      delta: 4
      reason: 主线单峰突破
    - when: "vol5_20 >= 1.8 and pct < 0"
      delta: -10
      reason: 放量下跌非突破
    - when: "rsi_12 > 72"
      delta: -6
      reason: RSI 过热
    - when: "chip_concentration < 18"
      delta: -8
      reason: 筹码发散

risk:
  rules:
    - when: "max_dd20 < -12"
      level: medium
      flag: 趋势回撤偏大
      score_delta: -6
    - when: "vol5_20 >= 1.5 and pct < 0"
      level: high
      flag: 放量下跌，非健康突破
      score_delta: -12
    - when: "dsa_macd_score <= 2"
      level: high
      flag: MACD 转弱
      score_delta: -10
    - when: "twenty_cm_risk_gate == 'caution'"
      level: medium
      flag: 20cm 票突破需降仓
      score_delta: -5
    - when: "news_risk_count > 0"
      level: high
      flag: 新闻风险未完全排除
      score_delta: -10
    - when: "limit_up_overheat_score >= 78"
      level: high
      flag: 涨停情绪过热，不做单峰突破
      score_delta: -10
