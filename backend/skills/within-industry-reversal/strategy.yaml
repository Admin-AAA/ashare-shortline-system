# 行业内短期反转（研究原型，2026-10-13 Grok Bot）
# 假设：行业整体不弱、个股 20 日相对行业明显落后、当日企稳且未放量（非恐慌、非追涨），博行业内短期反转。
# 来源：Liu, Stambaugh & Yuan (2019) Size and value in China, JFE（A股反转与异常换手异象）https://www.sciencedirect.com/science/article/pii/S0304405X19300625 ；NY Fed Staff Report 513 Decomposing Short-Term Return Reversal（行业内反转强于全市场反转）https://www.newyorkfed.org/medialibrary/media/research/staff_reports/sr513.html
# 状态：enabled=false；回放用 ASHARE_RESEARCH_EXTRA_SKILLS 临时纳入，按最近 12 个月单策略口径评估。
id: within-industry-reversal
name: 行业内短期反转
enabled: false
weight: 1.0
default_entry_mode: next_open
meta:
  author: grokbot
  style: short-term-reversal
  version: 0.1.0
  holding_days: [1, 3, 5]
  strategy_independence: 0.85
  default_preset_groups:
    experiment_within_industry_reversal:
      weight: 1.0
      sort_order: 10
contract:
  type: strategy
  executable: true
  schema_version: 1
universe:
  include:
    - "amount_yi >= 2"
    - "free_mv_yi >= 30"
    - "turnover_rate >= 1"
    - "turnover_rate <= 8"
    - "twenty_cm_risk_gate != 'block'"
  exclude:
    - "is_st == true"
    - "announcement_negative_count > 0"
    - "news_risk_count > 1"
prefilter:
  market:
    include:
      - when: "primary_excess20 <= -8"
        reason: "not_laggard"
      - when: "chg20 >= -22 and chg20 <= -4"
        reason: "not_pullback"
      - when: "pct >= 0 and pct <= 4"
        reason: "not_stabilizing"
      - when: "volume_ratio_vs_20d <= 1.5"
        reason: "abnormal_turnover"
      - when: "industry_positive_excess20_count >= 2"
        reason: "industry_weak"
    exclude:
      - when: "max_dd20 < -28"
        reason: "collapse"
phases:
  - name: 冰点情绪降权
    when: "market_sentiment_phase == '冰点'"
    score_cap: 60
    hard_veto: false
    risk_flags: ["冰点情绪"]
setups:
  - name: 行业内短期反转
    when: "primary_excess20 <= -8 and pct >= 0 and volume_ratio_vs_20d <= 1.5"
    score_delta: 10
    entry_rule: "次日开盘介入，高开超过 6% 不追（执行层 gap 闸门）"
    invalid_rule: "跌破信号日低点"
scoring:
  base: 54
  rules:
    - when: "primary_excess20 <= -12"
      delta: 5
      reason: 相对行业落后更多
    - when: "rsi_6 >= 45"
      delta: 4
      reason: 短期动能修复
    - when: "main_net_inflow_yi > 0"
      delta: 4
      reason: 主力净流入
    - when: "pe_ttm > 0 and pe_ttm < 60"
      delta: 3
      reason: 估值不极端
    - when: "is_main_theme == true"
      delta: 3
      reason: 所在行业为主线
risk:
  rules:
    - when: "pledge_ratio >= 40"
      level: high
      flag: 高质押
      score_delta: -10
