id: chao-gu-yang-jia-skill
name: 炒股养家大局观
enabled: true
weight: 1.0

meta:
  author: system
  style: shortline
  version: 0.1.0
  holding_days: [1, 3, 5]

contract:
  type: strategy
  executable: true
  schema_version: 1

universe:
  include:
    - "amount_yi >= 3"
  exclude:
    - "announcement_negative_count > 0"
    - "is_st == true"

phases:
  - name: 退潮
    when: "(dist20 < 0 and chg20 < 0) or max_dd20 < -15"
    score_cap: 35
    hard_veto: true
    risk_flags: ["退潮不交易"]

  - name: 非主线加速
    when: "dist60 > 30 and pos60 > 90 and _is_main == false"
    score_cap: 20
    hard_veto: true
    risk_flags: ["非主线加速不参与"]

  - name: 一致加速
    when: "dist60 > 30 and pos60 > 90"
    score_cap: 68
    hard_veto: false
    risk_flags: ["一致加速持有不追"]

  - name: 分歧
    when: "dist20 < 10 or (off_high_pct < -3 and pct < 0)"
    score_cap: 86
    hard_veto: false

  - name: 启动
    when: "dist20 < 15 and chg20 < 25 and pos20 < 85"
    score_cap: 90
    hard_veto: false

setups:
  - name: 分歧低吸
    when: "_is_main == true and off_high_pct < -3 and pct < 0"
    score_delta: 12
    entry_rule: "主线龙头回踩MA5/MA10止跌后重新走强"
    invalid_rule: "板块走弱或跌破分歧低点"

  - name: 平台突破
    when: "_is_main == true and breakout20 == true and industry_capacity_like_count >= 2"
    score_delta: 10
    entry_rule: "放量突破平台，同行业至少2只同步走强"
    invalid_rule: "突破失败且跌回平台"

scoring:
  base: 50
  rules:
    - when: "_is_main == true"
      delta: 12
      reason: 主流行业
    - when: "industry_capacity_like_count >= 3"
      delta: 10
      reason: 板块容量合力
    - when: "primary_excess20 > 8"
      delta: 8
      reason: 个股超额收益占优
    - when: "_is_main == false"
      delta: -15
      reason: 非主流行业降权
    - when: "industry_capacity_like_count <= 1 and _is_main == false"
      delta: -20
      reason: 非主线孤票回避

risk:
  rules:
    - when: "turnover_rate > 12"
      level: high
      flag: 高换手风险
    - when: "free_mv_yi > 5000 and dist60 > 30"
      level: medium
      flag: 大容量趋势票高位加速

