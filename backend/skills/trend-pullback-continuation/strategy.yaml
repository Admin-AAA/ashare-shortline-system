# ⚠️ SELF-IMPROVE FLAG: 覆盖盲区 (2026-07-09 第156轮深化)
# 近 60 天 formal 0 命中。根因=regime 适配（非配置 bug）：
#   universe 64→prefilter.include max_dd20>=-14(砍到5)→vol5_20<=1.05(0)→include_any(0)
# 弱势市场（07-08 regime=弱势, up_ratio=0.278）趋势票普遍 max_dd20<-14（59/64 被卡），
# 剩余 5 只无"缩量小跌"形态（vol5_20<=0.8 and pct∈[-5,0]）。
# 教训库第141轮：震荡 regime failed 100% stop_loss；第148轮 pos60<50 效果 regime-dependent。
# 趋势回踩策略在弱势/震荡市场本就不该强产出——0 命中是市场适配而非死锁。
# prefilter 死锁已在前序轮修复（60e299d），include_any 已改用原始字段。当前是分数竞争+regime 双重作用。
# 下一步：等市场转活跃/强牛 regime 后验证是否自然命中；不强行放宽 max_dd20（破位股不该做回踩）。
id: trend-pullback-continuation
name: 强趋势缩量回踩
enabled: true
weight: 0.2

meta:
  author: system
  style: trend-pullback
  version: 0.1.0
  holding_days: [2, 3, 5]
  strategy_independence: 0.78
  default_preset_groups:
    formal_opening:
      weight: 0.90
      sort_order: 70
    formal_trend_core:
      weight: 1.05
      sort_order: 70
    experiment_trend_pullback:
      weight: 1.0
      sort_order: 10

contract:
  type: strategy
  executable: true
  schema_version: 1

universe:
  include:
    - "amount_yi >= 2.5"
    - "turnover_rate >= 1"
    - "turnover_rate <= 8"
    - "chg20 >= 3"
    - "pos60 >= 55"
    - "off_high_pct >= -10"
    - "twenty_cm_risk_gate != 'block'"
  exclude:
    - "is_st == true"
    - "announcement_negative_count > 0"
    - "news_risk_count > 1"

prefilter:
  market:
    # dsa_trend_score 是 build_features 后置衍生分,prefilter 阶段为 0 会死锁;
    # 趋势强度已由 universe(pos60>=55,off_high_pct>=-10,chg20>=3) + phases.破位回避(dsa_trend_score<18 硬否决) 兜底
    include:
      - when: "max_dd20 >= -14"
        reason: "drawdown_too_large"
      - when: "upper_shadow_count20 <= 5"
        reason: "upper_shadow_too_many"
      - when: "vol5_20 <= 1.05"
        reason: "pullback_volume_not_shrink"
    include_any:
      # 第 N+15 轮 T5 修复：原条件依赖 volume_shrink_pullback/support_ma5（build_features 后置衍生 bool），
      # prefilter 阶段为 None/False → 死锁 0 命中（formal 近 60 天 0 覆盖）。
      # 改用原始字段（vol5_20/pct，market_pool 阶段已填充）：缩量回踩让候选进 skill_gate，
      # 均线支撑/support_ma5 交给 skill_gate（build_features 后有完整 feature）判断。
      - when: "vol5_20 <= 0.8 and pct <= 0 and pct >= -5"
        reason: "requires_shrink_pullback"
      - when: "vol5_20 <= 0.8 and pct <= 0 and pct >= -5"
        reason: "requires_shrink_pullback_ma10"
      # 放宽 vol5_20<=0.9 → <=1.0：与 include 规则 1.05 对齐，让"均量未放大+窄幅"
      # 的趋势内回踩候选能进 prefilter（原 0.9 过严，07-07 formal 仅 1 只通过 prefilter）
      # 实验回测：vol5_20∈[0.9,1.05] 的 trend-pullback 历史样本 2 笔 WR 50%/+4.61%
      - when: "pct >= -1.5 and pct <= 1 and vol5_20 <= 1.0"
        reason: "requires_near_ma_support"
    exclude:
      - when: "dist20 > 18 and rsi_12 > 72"
        reason: "overheated_not_pullback"
      - when: "off_high_pct < -10 and pct < 0"
        reason: "trend_broken"
      - when: "vol5_20 >= 1.5 and pct < 0"
        reason: "volume_down_not_pullback"
      # limit_up_overheat_score(后置衍生分)移到 risk.rules,build_features 后判断

phases:
  # 强势多头发散毒区（2026-09-12 LIVE 去重241验证）：dsa_trend_score==30（=trend_status强势多头/均线发散上行）
  # n=17 WR17.6% avg-2.83，逐月全差、chg20<40子集反而0%——形态本身即末端反转。软cap58不hard_veto。
  # 置于phases最前但用 not(...) 让位所有 hard_veto（永不架空否决）。
  - name: 强势多头发散毒区
    when: "(dsa_trend_score == 30) and not (max_dd20 < -14 or (off_high_pct < -10 and pct < 0) or dsa_trend_score < 18)"
    score_cap: 58
    hard_veto: false
    risk_flags: ["强势多头均线发散上行（LIVE 17.6%WR/-2.83avg 末端反转毒区），降权不追"]

  # 长周期RSI低位毒区（2026-09-12 LIVE 去重241验证）：rsi_24<48 n=38 WR27.0% avg-1.41（<45更毒15%/-2.07）
  # 跨regime一致，对照>=56 WR47.2%。24日RSI低位=中期下跌接飞刀。软cap58；与强势多头正交。
  # 置于phases最前，not(...) 让位所有 hard_veto。
  - name: 长周期RSI低位毒区
    when: "(rsi_24 > 0 and rsi_24 < 48) and not (max_dd20 < -14 or (off_high_pct < -10 and pct < 0) or dsa_trend_score < 18)"
    score_cap: 58
    hard_veto: false
    risk_flags: ["24日RSI<48中期弱势接飞刀（LIVE 27%WR/-1.41avg），降权"]

  # 短线龙头低分降权（2026-09-12 LIVE 去重241验证）：shortline_leader_score<=35 底三分位逐月全差
  # （5月40/6月0/7月36/8月25/9月21%），对照>52逐月50-69%。非龙头缺接力，软cap62温和降权。
  # 置于phases最前，not(...) 让位所有 hard_veto（永不架空否决）。
  - name: 短线龙头低分降权
    when: "(shortline_leader_score > 0 and shortline_leader_score <= 35) and not (max_dd20 < -14 or (off_high_pct < -10 and pct < 0) or dsa_trend_score < 18)"
    score_cap: 62
    hard_veto: false
    risk_flags: ["短线龙头分<=35（非龙头缺接力，低桶逐月全差），温和降权"]

  - name: 破位回避
    when: "max_dd20 < -14 or (off_high_pct < -10 and pct < 0) or dsa_trend_score < 18"
    score_cap: 32
    hard_veto: true
    risk_flags: ["趋势支撑破坏，不做回踩低吸"]

  - name: 过热等待
    when: "dist20 > 18 and rsi_12 > 72"
    score_cap: 55
    hard_veto: false
    risk_flags: ["趋势过热，等待更充分回踩"]

  - name: 缩量回踩确认
    when: "volume_shrink_pullback == true and (support_ma5 == true or support_ma10 == true) and dsa_trend_score >= 18"
    score_cap: 90
    hard_veto: false

  - name: 趋势内轻回踩
    when: "pct >= -1.5 and pct <= 1 and support_ma5 == true and vol5_20 <= 1.0"
    score_cap: 84
    hard_veto: false
setups:
  - name: MA5缩量低吸
    when: "volume_shrink_pullback == true and support_ma5 == true and dsa_trend_score >= 18 and pct <= 1"
    score_delta: 10
    entry_rule: "缩量回踩 MA5 不破，次日重新转强或盘中收回均线后参与"
    invalid_rule: "放量跌破 MA5 且不能快速收回"

  - name: MA10趋势回踩
    when: "volume_shrink_pullback == true and support_ma10 == true and dsa_trend_score >= 26 and max_dd20 >= -10"
    score_delta: 8
    entry_rule: "强趋势回踩 MA10 获得承接，等待止跌阳线确认"
    invalid_rule: "跌破 MA10 后继续放量走弱"

  - name: 强趋势轻分歧
    # vol5_20<=1.0（与 prefilter include_any 第三选项 + phase 趋势内轻回踩对齐）
    # 0.9 无因果依据；回测：301086 vol5_20=0.987 命中后 success +7.93%（take_profit_hit）
    when: "ma5 > ma10 and ma10 > ma20 and dist20 > 10 and eff20 > 0.5 and pct >= -1.5 and pct <= 0.8 and vol5_20 <= 1.0 and support_ma5 == true"
    score_delta: 7
    entry_rule: "强趋势轻分歧日不追，尾盘或次日确认承接"
    invalid_rule: "轻分歧演变为放量下跌"

  - name: 趋势支撑观察
    when: "ma5 > ma10 and ma10 > ma20 and support_ma5 == true and off_high_pct >= -8 and capital_resonance_score >= 60"
    score_delta: 2
    entry_rule: "多头趋势仍在且 MA5 支撑有效，等待缩量回踩或重新放量转强"
    invalid_rule: "跌破 MA10 或放量跌破 MA5 后不能收回"

scoring:
  base: 42
  rules:
    - when: "ma5 > ma10 and ma10 > ma20 and dist20 > 10 and eff20 > 0.5"
      delta: 10
      reason: 强势多头结构
    - when: "ma5 > ma10 and ma10 > ma20"
      delta: 7
      reason: 多头排列
    - when: "dsa_trend_score >= 26"
      delta: 8
      reason: 趋势评分高
    - when: "dsa_support_score >= 10"
      delta: 7
      reason: MA5/MA10 双支撑
    - when: "dsa_macd_score >= 8"
      delta: 6
      reason: MACD 多头
    - when: "volume_shrink_pullback == true"
      delta: 8
      reason: 缩量回踩
    - when: "support_ma5 == true"
      delta: 5
      reason: MA5 支撑有效
    - when: "support_ma10 == true"
      delta: 4
      reason: MA10 支撑有效
    - when: "capital_resonance_score >= 60"
      delta: 6
      reason: 资金承接未弱化
    - when: "is_main_theme == true"
      delta: 5
      reason: 主线趋势内回踩
    - when: "off_high_pct >= -5"
      delta: 4
      reason: 距高点不远
    - when: "vol5_20 < 0.65"
      delta: -4
      reason: 量能过度萎缩，弹性不足
    - when: "rsi_12 > 72"
      delta: -6
      reason: RSI 过热
    - when: "upper_shadow_count20 >= 4"
      delta: -5
      reason: 上影线压力偏多

risk:
  rules:
    - when: "max_dd20 < -12"
      level: medium
      flag: 趋势回撤偏大
      score_delta: -6
    - when: "vol5_20 >= 1.3 and pct < 0"
      level: high
      flag: 放量下跌，不是健康回踩
      score_delta: -12
    - when: "dsa_macd_score <= 2"
      level: high
      flag: MACD 转弱
      score_delta: -10
    - when: "twenty_cm_risk_gate == 'caution'"
      level: medium
      flag: 20cm 趋势票回踩需降仓
      score_delta: -5
    - when: "news_risk_count > 0"
      level: high
      flag: 新闻风险未完全排除
      score_delta: -10
    - when: "limit_up_overheat_score >= 78"
      level: high
      flag: 涨停情绪过热,不做回踩低吸
      score_delta: -12
