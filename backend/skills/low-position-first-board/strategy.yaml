# 低位首板启动（研究原型，2026-10-13 Grok Bot）
# 假设：低位（pos60 不高、20 日涨幅有限）的首个涨停、封板质量好且有板块支撑，是题材启动的第一棒；
# 与涨停回封接力（偏回封/连板）不同，只做低位、首板、封板稳的票。
# 状态：enabled=false，仅通过 ASHARE_RESEARCH_EXTRA_SKILLS 进入研究回放；按 hold-out 协议评估后再决定。
id: low-position-first-board
name: 低位首板启动
enabled: false
weight: 1.0
default_entry_mode: next_open
meta:
  author: grokbot
  style: limit-up-first-board
  version: 0.1.0
  holding_days: [1, 2, 3]
  strategy_independence: 0.8
  default_preset_groups:
    experiment_low_position_first_board:
      weight: 1.0
      sort_order: 10
contract:
  type: strategy
  executable: true
  schema_version: 1
require_setup: true  # 未命中 setup 不得凭 base 分进池（防 fill 路径噪声分）
universe:
  include:
    - "amount_yi >= 2"
    - "amount_yi <= 20"
    - "free_mv_yi >= 15"
    - "turnover_rate >= 3"
    - "turnover_rate <= 15"
    - "is_limit_up == true"
    - "twenty_cm_risk_gate != 'block'"
  exclude:
    - "is_st == true"
    - "announcement_negative_count > 0"
    - "news_risk_count > 0"
prefilter:
  market:
    include:
      - when: "limit_up_consecutive_days == 1"
        reason: "not_first_board"
      - when: "limit_up_days20 <= 1"
        reason: "recent_boards_exist"
      - when: "pos60 <= 75"
        reason: "position_too_high"
      - when: "chg20 <= 15"
        reason: "already_rallied"
      - when: "limit_up_open_times <= 2"
        reason: "seal_unstable"
    include_any:
      - when: "is_main_theme == true"
        reason: "requires_main_theme"
      - when: "sector_ladder_completeness_score >= 50"
        reason: "requires_sector_ladder"
      - when: "industry_capacity_like_count >= 2"
        reason: "requires_sector_breadth"
    exclude:
      - when: "limit_up_open_times == 0 and turnover_rate < 3"
        reason: "one_word_board"
phases:
  - name: 冰点情绪首板不接
    when: "market_sentiment_phase == '冰点'"
    score_cap: 55
    hard_veto: false
    risk_flags: ["冰点情绪，首板溢价低"]
  - name: 涨停过热
    when: "limit_up_overheat_score >= 82"
    score_cap: 55
    hard_veto: false
    risk_flags: ["全市场涨停过热，首板次日分歧大"]
setups:
  - name: 低位首板
    when: "is_limit_up == true and limit_up_consecutive_days == 1 and pos60 <= 75"
    score_delta: 10
    entry_rule: "次日开盘介入，不追高开超过 6% 的票（执行层 gap 闸门）"
    invalid_rule: "次日跌破首板涨停价下方 3%"
scoring:
  base: 50
  rules:
    - when: "limit_up_fd_amount_yi >= 0.5"
      delta: 5
      reason: 封单充足
    - when: "limit_up_open_times == 0"
      delta: 4
      reason: 未开板
    - when: "pos60 <= 50"
      delta: 5
      reason: 更低位
    - when: "is_main_theme == true"
      delta: 6
      reason: 主线题材首板
    - when: "sector_ladder_completeness_score >= 75"
      delta: 4
      reason: 板块梯队完整
    - when: "main_net_inflow_yi > 0"
      delta: 4
      reason: 主力净流入
    - when: "breakout20 == 1"
      delta: 3
      reason: 首板同时突破平台
risk:
  rules:
    - when: "limit_up_open_times >= 2"
      level: medium
      flag: 封板有分歧
      score_delta: -4
    - when: "pledge_ratio >= 40"
      level: high
      flag: 高质押
      score_delta: -10
