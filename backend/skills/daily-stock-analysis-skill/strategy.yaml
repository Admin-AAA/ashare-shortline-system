id: daily-stock-analysis-skill
name: 基础短线策略
enabled: true
weight: 0.3

meta:
  author: system
  style: technical-score
  version: 0.1.0
  holding_days: [1, 3, 5]
  default_preset_groups:
    formal_opening:
      weight: 1.15
      sort_order: 30
    formal_trend_core:
      weight: 0.95
      sort_order: 30
    experiment_single_factor:
      weight: 1.0
      sort_order: 10

contract:
  type: strategy
  executable: true
  schema_version: 1

universe:
  include:
    - "amount_yi >= 3"
    - "amount_yi < 15"  # 大成交额排除：>=15亿时 DSA WR=32.4%（n=34全量/n=25前瞻），策略不适用机构博弈盘（因果：DSA是技术趋势策略，机构博弈盘价格行为非趋势跟随）
    - "turnover_rate >= 1.5"  # SELF-IMPROVE T3 第185轮：低换手率毒区（反事实护栏 delta_net=+19.84，36笔输赢各半但亏单均亏>赢单均赚，净正）；NFT入场即套与低换手同源；07-16前瞻样本一致（turnover<1.5 的6笔净-8.5%）
  exclude:
    - "is_st == true"
    - "announcement_negative_count > 0"

prefilter:
  market:
    include:
      - when: "turnover_rate >= 1.5"
        reason: "turnover_too_low"
      - when: "turnover_rate <= 12"
        reason: "turnover_too_high"
      - when: "max_dd20 >= -20"
        reason: "drawdown_too_large"
      - when: "upper_shadow_count20 <= 6"
        reason: "upper_shadow_too_many"
    include_any:
      - when: "breakout20 == 1"
        reason: "requires_breakout_or_support"
      - when: "support_ma5 == true"
        reason: "requires_breakout_or_support"
      - when: "support_ma10 == true"
        reason: "requires_breakout_or_support"
      - when: "off_high_pct >= -10 and pct >= -2"
        reason: "requires_tradeable_position"
    exclude:
      - when: "pos60 > 97 and dist60 > 32"
        reason: "late_acceleration"
      - when: "rsi_12 > 78 and dist20 > 12"
        reason: "overheated_extension"
      - when: "off_high_pct < -18 and pct < 0"
        reason: "broken_trend"
      - when: "pos20 < 50"
        reason: "low_pos20_weakness"
      # pos60<50 是最强负向预测因子：38笔 WR=26.3%（远低于50%基线）。
      # pos60<50 = 60日位置极低，长期下跌趋势，入场后大概率继续下跌触发止损。
      # 数据驱动（T3 第129轮失败归因闭环，500笔去重 sample）
      - when: "pos60 < 50"
        reason: "low_pos60_long_term_downtrend"
      # chg20>50+pct>2 = WR 22.6%（31笔），gap_roundtrip 高发区：
      # 20日涨幅>50%的股票在当日涨>2%时入场，几乎必亏（冲高回落）。
      # 对比 chg20>50+pct<=2 WR=69.8%（43笔），问题在"追涨"不在"涨多了"。
      # 数据驱动（T3 第138轮失败归因闭环，500笔去重 sample）
      - when: "chg20 > 50 and pct > 2"
        reason: "overextended_chase"
      # chg20<15 & 3<=pct<9.5 = WR 27.3%（33笔），avg -2.52%，PL 0.15——冷门追高毒区。
      # 对称于 overextended_chase：20日没涨(chg20<15)的冷门股当日拉升3%-9.5%(非涨停封板)
      # = 冲高回落出货，次日大概率止损。涨停封板(pct>=9.5)有溢价效应保留不排除
      # （pct>=9.5 WR=57.9%）。反事实：排除后整体 PL 1.73->3.05，WR 54.5%->60.7%。
      # 数据驱动（T3 第157轮 D项下滑失败归因闭环，178笔 LIVE formal 去重 sample）
      - when: "chg20 < 15 and pct >= 3 and pct < 9.5"
        reason: "cold_chase_pullback"
      # avg_cost>200 prefilter 已删除：avg_cost 在 feature_builder 阶段才填充，prefilter 阶段不可用（永远 False）；
      # 且数据证明 avg_cost>200 的科创板高价龙头 WR 76.8% avg 3.81%，过滤是误杀（第 100 轮 T5 修复）

phases:
  # 强势多头发散毒区（2026-09-12 LIVE 去重241验证）：dsa_trend_score==30（=trend_status强势多头/均线发散上行）
  # n=17 WR17.6% avg-2.83，逐月全差、chg20<40子集反而0%——形态本身即末端反转。软cap58不hard_veto。
  # 置于phases最前但用 not(...) 让位所有 hard_veto（永不架空否决）。
  - name: 强势多头发散毒区
    when: "(dsa_trend_score == 30) and not (news_risk_count > 1 or (dsa_trend_score <= 4 and dsa_macd_score == 0)) and not (pos60 > 90) and not (vol5_20 >= 3.0 and rsi_12 < 55) and not (off_high_pct >= -10 and off_high_pct < -5) and not (market_regime == '弱势' and market_sentiment_phase != '高潮' and chg20 < 10)"
    score_cap: 58
    hard_veto: false
    risk_flags: ["强势多头均线发散上行（LIVE 17.6%WR/-2.83avg 末端反转毒区），降权不追"]

  # 长周期RSI低位毒区（2026-09-12 LIVE 去重241验证）：rsi_24<48 n=38 WR27.0% avg-1.41（<45更毒15%/-2.07）
  # 跨regime一致，对照>=56 WR47.2%。24日RSI低位=中期下跌接飞刀。软cap58；与强势多头正交。
  # 置于phases最前，not(...) 让位所有 hard_veto。
  - name: 长周期RSI低位毒区
    when: "(rsi_24 > 0 and rsi_24 < 48) and not (news_risk_count > 1 or (dsa_trend_score <= 4 and dsa_macd_score == 0)) and not (pos60 > 90) and not (vol5_20 >= 3.0 and rsi_12 < 55) and not (off_high_pct >= -10 and off_high_pct < -5) and not (market_regime == '弱势' and market_sentiment_phase != '高潮' and chg20 < 10)"
    score_cap: 58
    hard_veto: false
    risk_flags: ["24日RSI<48中期弱势接飞刀（LIVE 27%WR/-1.41avg），降权"]

  # 短线龙头低分降权（2026-09-12 LIVE 去重241验证）：shortline_leader_score<=35 底三分位逐月全差
  # （5月40/6月0/7月36/8月25/9月21%），对照>52逐月50-69%。非龙头缺接力，软cap62温和降权。
  # 置于phases最前，not(...) 让位所有 hard_veto（永不架空否决）。
  - name: 短线龙头低分降权
    when: "(shortline_leader_score > 0 and shortline_leader_score <= 35) and not (news_risk_count > 1 or (dsa_trend_score <= 4 and dsa_macd_score == 0)) and not (pos60 > 90) and not (vol5_20 >= 3.0 and rsi_12 < 55) and not (off_high_pct >= -10 and off_high_pct < -5) and not (market_regime == '弱势' and market_sentiment_phase != '高潮' and chg20 < 10)"
    score_cap: 62
    hard_veto: false
    risk_flags: ["短线龙头分<=35（非龙头缺接力，低桶逐月全差），温和降权"]

  - name: 风险否决
    when: "news_risk_count > 1 or (dsa_trend_score <= 4 and dsa_macd_score == 0)"
    score_cap: 20
    hard_veto: true
    risk_flags: ["重大风险情报或趋势破坏"]

  # 接近60日高位追高毒区：通用分析技能（非打板/接力）不该追 60 日高位，均值回归风险
  # LIVE 验证（2026-07 第172轮 D项残留毒区归因，daily-stock-analysis-skill 去重样本 n=66）：
  #   pos60>90: n=7 WR=57.1% avg=-0.20% | 其余 n=59 WR=71.2% avg=+1.56%
  #   对照全样本 pos60>90 WR=86.4%（涨停/龙虎榜等动量策略在高位赢，但本通用技能追高位净负）
  #   因果：本技能非打板策略，pos60>90=接近60日最高位，入场即追高；次日无封板资金护盘易回撤触发止损
  #     （002266 pct=8.7 pos60=92.98 → -5.72% 即此类）。用 hard_veto（与本技能 pos60<50 极端位否决同档），
  #     不误伤多技能共识的动量票——其他动量技能(chen-xiaoqun/龙虎榜)仍可在高位正常推荐。
  - name: 接近60日高位追高毒区
    when: "pos60 > 90"
    score_cap: 50
    hard_veto: true
    risk_flags: ["接近60日高位(追高回撤风险)，通用分析技能不宜追高"]

  # 爆量弱势衰竭毒区：高量能(5日均量比>=3) + 弱势RSI(<55) = 高位派发/衰竭，次日均值回归向下
  # LIVE 验证（2026-07-11 D项残留毒区归因，daily-stock-analysis-skill 去重样本 n=114）：
  #   vol5_20>=3.0 & rsi_12<55: n=27 WR=40.7%(16败/11赢) vs 其余 n=87 WR=77.0%(67赢/20败)
  #   该桶失败率 59.3% vs 基线 31.6%（约 2x 集中），反事实剔除 ΔWR +8.6pp（净正，误伤比40.7%）
  #   因果：5日均量比>=3=当日成交量3倍于20日均值=异常巨量；结合 rsi_12<55(非超买、股价不强)
  #     = 弱势股上的巨量多为派发/对倒出货而非真实资金进攻，次日大概率低开回撤触发止损
  #     （正海磁材 vol5_20=3.518 rsi=46.5、儒意 vol5_20=3.761 rsi=49.7 均在此桶且止损）
  #   反事实验证：全量 LIVE formal 上该桶净负（拦16输/误伤11赢），加 hard_veto 不误伤动量 alpha。
  - name: 爆量弱势衰竭毒区
    when: "vol5_20 >= 3.0 and rsi_12 < 55"
    score_cap: 50
    hard_veto: true
    risk_flags: ["高量能(5日均量比>=3)+弱势RSI(<55)，巨量派发衰竭，次日易回撤"]

  # 中度回撤毒区：距高点回撤 5%~10%（-10<=off_high<-5）
  # LIVE 验证（2026-07-21 T3，daily-stock-analysis-skill formal primary 去重 n=107）：
  #   oh∈[-10,-5): n=26 WR=38.5% avg=-1.98% | 其余 n=81 WR=64.2% avg=+0.98%
  #   反事实剔除 ΔWR +6.3pp（57.9%→64.2%），跨 7 个独立交易日（非单日伪影）
  #   因果：通用技术趋势策略在「刚跌破近高、尚未深调」的半吊子回撤位易接飞刀——
  #     不够深（无均值回归安全垫）、又非强势新高（无动量溢价），次日继续杀跌触发止损。
  #     对照 oh>=-5 WR=64.2%（仍在高位强势）、prefilter 已拦 oh<-18 崩坏趋势。
  # 动作：hard_veto cap50；不误伤动量策略（chen-xiaoqun 等仍可用更深 oh 主线票）。
  - name: 中度回撤毒区
    when: "off_high_pct >= -10 and off_high_pct < -5"
    score_cap: 50
    hard_veto: true
    risk_flags: ["距高点回撤5%~10%半吊子位(WR38.5%净负)，通用分析不宜接飞刀"]

  - name: 过热观察
    when: "dsa_bias_score >= 20 and rsi_12 > 70"
    score_cap: 68
    hard_veto: false
    risk_flags: ["高乖离+RSI超买，警惕短线回撤（bias_ma5>5% 强势但 RSI>70 短期过热）"]

  - name: 趋势不足
    when: "dsa_trend_score < 18"
    score_cap: 50  # late 期 dsa_trend_score<18 40 笔 WR 22.5%，cap 50 低于 score_line 72，相当于过滤
    hard_veto: false
    risk_flags: ["趋势分不足，alpha 衰减后低 WR"]

  # 弱市多头顺势毒区：已弃用（第147轮反事实验证后下线）
  # 历史：第142轮加，用 dsa 复合分（trend>=26 & bias>=14 & macd>=8）覆盖弱市多头趋势票
  # 弃用原因：dsa 复合分映射不稳（prior 第143轮已证），该 phase 误伤超跌/低位/涨停 alpha：
  #   全量 dsa 弱势被该 phase 拦截的样本按 pct 分桶（LIVE formal 去重）：
  #     A超跌(pct<0) n=11 WR=63.6% 合计+28.64% | B低位(0-3) n=14 WR=57.1% 合计+10.41%
  #     D半强势(5-9.5) n=15 WR=86.7% 合计+12.39% | E涨停(>=9.5) n=5 WR=60% 合计+25.55%
  #     C半吊子(3-5) n=18 WR=11.1% 合计-64.96%（唯一真毒区，但已被第144轮"弱市半吊子追高毒区"精确覆盖）
  #   移除后恢复放行 36 笔 alpha（合计+86.23%），C桶仍被半吊子毒区拦、D桶高乖离仍被第145轮半强势高乖离毒区拦，行为不退化。
  #   该 phase 用 dsa 复合分把超跌均值回归（pct<0 WR=61.4%）和涨停惯性（pct>=9.5 WR=69.7%）当多头顺势误拦，净负。
  # - name: 弱市多头顺势毒区
  #   when: "market_regime == '弱势' and dsa_trend_score >= 26 and dsa_bias_score >= 14 and dsa_macd_score >= 8"
  #   score_cap: 68
  #   hard_veto: false
  #   risk_flags: ["弱市多头顺势净零期望高方差，弱市不宜追多"]

  # 弱市半吊子追高毒区：弱市+当日涨幅 3-5%（尾盘追高半吊子位）→ score_cap 68（低于 score_line 72）
  # LIVE 验证（2026-07 第144轮 D项持续恶化失败归因闭环，全策略 LIVE formal 去重）：
  #   弱势 & pct∈[3,5]: n=64 WR=23.4% avg=-1.52% PL=0.10（3 个月稳定毒区：5月14.3%/6月51.9%/7月23.3%，均低于 other）
  #   daily 弱势 & pct∈[3,5]: n=26 WR=23.1% avg=-2.28%
  #   对照（弱市 pct 分桶，两侧均 alpha，唯独 3-5 毒区）:
  #     pct<0(超跌) n=70 WR=61.4% avg=+1.81% | pct∈[0,3) n=45 WR=66.7% avg=+1.85%
  #     pct∈[5,7) n=27 WR=70.4% avg=+3.21% | pct>=9 n=33 WR=69.7% avg=+2.15%
  # 第143轮根因：旧条件 pct>=3 and bias_ma5>=5 漏掉 bias<5 子集（17 笔 WR=23.5% avg=-1.39% 未覆盖），
  #   且 pct>5 的强势封板/涨停惯性区是 alpha 不能误伤，故精确收敛到 pct∈[3,5]。
  # 因果：3-5% 涨幅既无超跌安全垫也无涨停封板惯性，弱市次日无资金护盘闷杀（up_ratio<0.35），
  #   trailing_stop/stop_loss 高发。弱市 alpha 应留在超跌均值回归（pct<0）而非半吊子追高。
  - name: 弱市半吊子追高毒区
    when: "market_regime == '弱势' and pct >= 3 and pct <= 5"
    score_cap: 68
    hard_veto: false
    risk_flags: ["弱市半吊子追高（当日涨3-5%无封板惯性无超跌安全垫），弱市宜等超跌不宜追多"]

  # 弱市半强势高乖离追高毒区：弱市+当日涨5-9.5%（非涨停封板）+ bias_ma5>=5（高乖离）→ cap 68
  # LIVE 验证（2026-07 第145轮 D项失败归因，全策略 LIVE formal 去重）：
  #   弱势 & pct∈(5,9.5) & bias_ma5>=5: n=16 WR=43.8% avg=-2.21% min=-5.72%（毒区）
  #   对照 弱势 & pct∈(5,9.5) & bias_ma5<5: n=4 WR=100% avg=+3.55%（低乖离是 alpha 不误伤）
  #   对照 弱势 & pct>=9.5（涨停惯性）: n=33 WR=69.7% avg=+2.15%（封板是 alpha 不误伤）
  # 因果：5-9.5% 涨幅未封板（无涨停惯性资金护盘）+ 高乖离（bias_ma5>=5 当日已远离均线），
  #   弱市次日无资金接力，高乖离回踩触发 stop_loss（002266 pct=8.7 bias_ma5=8.45 → -5.72%）。
  #   用 pct<9.5 精确避开涨停封板区，用 bias_ma5>=5 避开低乖离均值回归 alpha。
  - name: 弱市半强势高乖离追高毒区
    when: "market_regime == '弱势' and pct > 5 and pct < 9.5 and bias_ma5 >= 5"
    score_cap: 68
    hard_veto: false
    risk_flags: ["弱市半强势高乖离追高（5-9.5%未封板+bias_ma5>=5高乖离，弱市无接力资金高乖离回踩止损）"]

  # 弱市窄幅无动量毒区：弱市·非高潮 + 20日累计涨幅<10%（窄幅横盘无趋势引擎）→ hard_veto
  # LIVE 验证（2026-07 第173轮 D项真残留毒区归因，daily-stock-analysis-skill LIVE formal 去重 n=138）：
  #   弱势 & market_sentiment_phase != '高潮' & chg20<10: n=19 WR=47.4% avg=-1.10% net=-20.83% PL=0.61
  #     dropped 子集 WR 远低于策略基线 60.9%，剔除后 WR 60.9%→63.0% / net +97.74→+118.57 (Δ+20.83) / PL 1.39→1.60
  #   边际增量（未被现有 弱市半吊子/半强势高乖离/爆量衰竭 毒区覆盖部分）: 2输+3赢 net +3.76%，
  #     说明本 phase 与现有 pct 维度毒区正交，覆盖的是「20日窄幅横盘无趋势」另一轴的失败。
  #   代表样本（veto target）：
  #     rec_20260707_006_4072 pct=-1.85 chg20=8.8 → -2.35%（弱市窄幅横盘入场即套，max_return 接近 0）
  #     rec_20260708_008_8f63 pct=4.305 chg20=-2.4 → +4.79%（被 dropped 视为误伤，但策略整体净正）
  #   对照 alpha（弱市但 chg20>=10 仍入场）: n=119 kept WR=63.0%，弱市窄幅无动量是失败轴而非弱市本身。
  # 因果：DSA 是技术趋势跟随技能，20日累计涨幅<10%=该股近 20 个交易日基本横盘无趋势可跟，
  #   弱市（up_ratio<0.35 市场宽度差）环境下资金不接力横盘股，入场后 max_return≤0.5% 无 follow-through，
  #   次日 gap 或 trailing_stop 触发止损。用 chg20<10 精确避开弱市中真有趋势的个股（chg20>=10 仍获推荐），
  #   且 market_sentiment_phase != '高潮' 排除弱市·高潮（反转信号 WR 84.6%，是 alpha 不误伤）。
  - name: 弱市窄幅无动量毒区
    when: "market_regime == '弱势' and market_sentiment_phase != '高潮' and chg20 < 10"
    score_cap: 50
    hard_veto: true
    risk_flags: ["弱市窄幅横盘（20日涨幅<10%无趋势引擎，市场宽度差无资金接力），技术趋势策略无可跟趋势，入场即套"]

  # ── 资金流毒区（2026-09-12 LIVE 聚合路径验证，525 笔已结算 recs）──
  # 验证方法：LIVE recs 特征+实盘结果按策略信号（score>=60）分层，门控 capital_flow。
  # 注意：sim 单策略 top-10 总体与 LIVE 聚合路径总体不同（重叠仅 4.4%），sim 反证不适用于这些规则。
  # 资金背离：2026-09-12 去重241复核推翻旧 hard_veto（旧证据仅 n=2 WR0%，样本过小）。
  #   资金背离 n=16 WR=56.2%（触发后60%），主力共振 n=38 WR=52.6%/+0.85，均为正alpha；
  #   sim pass-3 同向（背离 55.2% n=958、弱市61.4%）。hard_veto 会整票杀掉这些赢家，故移除否决、放行。
  #   （资金配合/高潮非主力仍是毒区，下方两条 cap 保留。）

  # 资金配合降权：LIVE n=38 WR5.3% avg-3.19 vs 其余 29.9%/avg-1.16
  - name: 资金配合降权
    when: "capital_resonance_source == 'capital_flow' and capital_resonance_signal == '资金配合'"
    score_cap: 58
    hard_veto: false
    risk_flags: ["资金仅配合未共振（LIVE 5.3% WR）"]

  # 高潮无主力共振毒区：LIVE n=12 WR8.3% avg-1.88 vs 其余 26.7%/avg-1.49
  - name: 高潮无主力共振毒区
    when: "capital_resonance_source == 'capital_flow' and market_sentiment_phase == '高潮' and capital_resonance_signal != '主力共振'"
    score_cap: 58
    hard_veto: false
    risk_flags: ["高潮情绪但无主力共振（追高毒区，LIVE 8.3% WR）"]

  - name: 趋势跟踪
    when: "dsa_trend_score >= 18"
    score_cap: 100
    hard_veto: false
setups:
  - name: 缩量回踩
    # Alpha 衰减警告（T1 第81轮检测）：
    # support_ma5 信号翻转——5月 True WR=59.6%（正预测），6-7月 True WR=41.4%（负预测）
    # 近期市场偏好"无 MA5 支撑的超跌股"（support_ma5=False WR=83.3%）
    # 此 setup 在6月仅触发2笔且都失败，需持续监控；若衰减持续，考虑降 score_delta 或禁用
    when: "volume_shrink_pullback == true and (support_ma5 == true or support_ma10 == true) and dsa_signal_score >= 80"
    score_delta: 6
    entry_rule: "缩量回踩 MA5/MA10 附近止跌后再确认承接"
    invalid_rule: "跌破均线支撑且收不回"

  - name: 放量突破
    when: "volume_breakout_signal == true and resistance_distance_pct <= 2.5 and dsa_signal_score >= 80"
    score_delta: 0  # 回测：放量突破 16 笔 WR=37.5% vs 无 setup 56.2%，setup 有害
    entry_rule: "放量突破近端压力位后跟随"
    invalid_rule: "突破失败，重新跌回压力位下方"

  - name: 多头顺势
    when: "dsa_trend_score >= 26 and dsa_bias_score >= 14 and dsa_macd_score >= 8"
    score_delta: 0  # 回测：多头顺势 504 笔 WR=55.0% vs 无 setup 845 笔 WR=58.1%，setup 有害
    entry_rule: "多头趋势内优先等回踩而不是追高"
    invalid_rule: "趋势走平且 MACD 转弱"

scoring:
  base: 0
  score_fields:
    - field: dsa_trend_score
      reason: 趋势分
    - field: dsa_bias_score
      reason: 乖离分
    - field: dsa_volume_score
      reason: 量能分
    - field: dsa_support_score
      reason: 支撑分
    - field: dsa_macd_score
      reason: MACD 分
    - field: dsa_rsi_score
      reason: RSI 分
  rules:
    # capital_flow_score >= 72 已移除：strict_real 模式下分数被 cap 到 55，规则从未触发（0/1585）
    # chip_health_score >= 72 已移除：86.8%命中+r=-0.145负预测力（均值回归信号）
    - when: "pos20 >= 80 and pos20 <= 95"
      delta: 5
      reason: 强势未过热（pos20 80-95 区间 67.4% 胜率，+4.36% 均收益）
    - when: "dist60 < 0"
      delta: 5
      reason: 价格低于 60 日均线（回调充分：87 笔 77.0% 胜率，+3.98% 均收益，与 pos20 零重叠）
    - when: "bias_ma5 >= 1 and bias_ma5 <= 3"
      delta: 4
      reason: 温和上行（bias_ma5 1-3 区间，去重实盘验证；0~1 仅 WR=29.2% 假突破多，排除）
    # intelligence_score >= 66 已移除：strict_real 模式下分数被 cap 到 50，规则从未触发（0/1585）
    - when: "avg_cost >= 80 and avg_cost <= 200"
      delta: 5
      reason: 筹码成本适中（80-200 元区间 71% 胜率，+2.7% 均收益，机构偏好中高价成长股）
    - when: "amount_yi < 5"
      delta: 4
      reason: 小成交额（<5 亿 65.1% 胜率，+2.92% 均收益，与 avg_cost 独立）
    # fundamental_score >= 68 已移除：strict_real 模式下分数被 cap 到 50，规则从未触发（0/1585）
    - when: "chip_concentration > 4 and chip_concentration <= 10"
      delta: 6
      reason: "筹码窄带宽优势（90%成本带宽 4-10=单峰密集，70.8% WR, +5.37% 均收益，弱势·冰点主力阶段 106 笔验证；2026-09-13 标签修正：原误标'分散'）"
    - when: "resistance_distance_pct >= 0 and resistance_distance_pct <= 3"
      delta: 6
      reason: "贴近阻力位突破前夜（0-3%: 87.5% WR, +7.42% 均收益，56 笔验证）"
    # 2026-09-13 清理（深审 A3-4）：此处原有"远离阻力位 >10"条目误放在 scoring 段
    # 且写 score_delta:-5（运行器在 scoring 段只读 delta，实际计 0 分，死条目）。
    # 风险段已有同条件 score_delta:-5 生效（只扣一次，正确），故整段删除而非改键。
    - when: "turnover_rate >= 5 and turnover_rate <= 10"
      delta: 4
      reason: "换手率适中（5-10%: 61.5% WR, +2.78% 均收益，797 笔验证）"
    # chip_concentration 4-10 重复规则已移除（上方 delta 6 已覆盖，此条 delta 4 永不触发）
    - when: "dsa_bias_score <= 6"
      delta: -8
      reason: 严重弱势乖离（bias_ma5 < -2%，实盘 WR=47.1%/38.5%，应扣分；原 <=2 误罚 bias>5% 强势股 WR=77.8-100%）
    # ── 新增辅助数据源正向加分（Tushare 15000 积分接口） ──
    # 股东人数减少>3% = 筹码集中（机构建仓代理信号）
    - when: "holder_num_decreasing == true"
      delta: 4
      reason: 股东人数减少（筹码集中，机构建仓代理信号，stk_holdernumber）
    # 机构调研密集（近30天≥3次且有基金访客）= 机构关注度高的正面信号
    - when: "survey_count >= 3 and survey_fund_visitors >= 10"
      delta: 3
      reason: 机构调研密集（近30天≥3次且有基金访客，stk_surv）

    # ── pass-4：真实资金流回测验证后保留/新增 ──
    # 基本面强度（LIVE 赢家中位 70.8% vs 输家 10.2%）；sim top-10 无影响，保留
    - when: "net_profit_yoy >= 30"
      delta: 4
      reason: 净利高增（基本面强度过滤题材噪音）

risk:
  rules:
    - when: "news_risk_count > 0"
      level: high
      flag: 新闻或公告风险
      score_delta: -18
    - when: "capital_resonance_source == 'capital_flow' and capital_resonance_signal == '资金配合'"
      level: medium
      flag: 资金仅配合未共振（LIVE 5.3% WR）
      score_delta: -6
    - when: "rsi_12 > 70"
      level: medium
      flag: RSI 超买
      score_delta: -8
    - when: "dsa_macd_score == 0"
      level: high
      flag: MACD 转弱
      score_delta: -12
    - when: "profit_ratio > 85"
      level: medium
      flag: 获利盘过高
      score_delta: -6
    - when: "price > 300"
      level: medium
      flag: 高价股风险
      score_delta: -8
    - when: "pos20 > 95"
      level: high
      flag: 位置过热（pos20>95 alpha 衰减：late 期 13 笔 WR 15.4%，-8→-16 加重）
      score_delta: -16
    - when: "market_regime == '震荡' and avg_cost >= 50 and avg_cost < 100"
      level: medium
      flag: 震荡期中价股风险（avg_cost 50-100 WR=41.2% vs 非震荡 75.6%）
      score_delta: -6
    # amount_yi 20-30 扩展：30-60 亿已被下方规则覆盖(-8)，但 20-30 亿同属毒区未覆盖。
    # LIVE 验证（第180轮 T3 D项 other 残留毒区，DSA LIVE formal 去重 n=117）：
    #   amount_yi 20-25: n=15 WR=33% avg=-2.06% | amount_yi 25-30: n=3 WR=33% avg=-3.10%
    #   amount_yi 30-40: n=6 WR=17% avg=-2.68%（已有规则）
    #   对照 amount_yi <15: n=57 WR=86% avg=2.84%（小成交额是真实 alpha）
    # 因果：20-30 亿成交额 = 已出现大资金参与（机构/游资已在博弈），通用技术策略对博弈方向
    #   判断力弱（依赖 DSA 信号），博弈扰动叠加 DSA 噪声 → WR 崩塌。30 亿以上已有扣分，
    #   20-30 是覆盖盲区，扩展规则消除盲区（-6，比 30-60 的 -8 略轻，样本n=18边际稍小）。
    # 反事实：全系统 WR 70.7%→73.3%(+2.7pp)，DSA 单策略 WR 72%→79%(+7pp)。
    - when: "amount_yi >= 20 and amount_yi < 30"
      level: medium
      flag: 成交额中大盘（20-30 亿区间 WR=33%，avg=-2.3%，机构博弈扰动通用技术信号）
      score_delta: -6
    - when: "amount_yi >= 30 and amount_yi < 60"
      level: medium
      flag: 成交额过大盘（30-60 亿区间 35.5% 胜率，-1.32% 均收益，机构博弈激烈）
      score_delta: -8
    - when: "chip_concentration > 18 and chip_concentration <= 30"
      level: medium
      flag: 筹码宽带宽风险（90%成本带宽 18-30=发散，仅 45.6% WR，分散持仓抛压大；2026-09-13 标签修正：原误标'集中'）
      score_delta: -5
    - when: "resistance_distance_pct > 10"
      level: medium
      flag: "远离阻力位（>10%: 43.6% WR, -0.26% 均收益，211 笔验证）"
      score_delta: -5
    - when: "turnover_rate >= 1 and turnover_rate < 3"
      level: medium
      flag: "换手率过低（1-3%: 38.7% WR, -0.36% 均收益，186 笔验证）"
      score_delta: -4
    - when: "amount_yi >= 80"
      level: high
      flag: "超大成交额风险（>80 亿: 30.0% WR, -1.02% 均收益，机构博弈激烈/流动性陷阱）"
      score_delta: -10
    # ── 新增辅助数据源风险扣分（Tushare 15000 积分接口） ──
    # 当日炸板（曾涨停后打开）= 情绪转弱，短线抛压大
    - when: "is_broken_limit_up == true"
      level: medium
      flag: 当日炸板（情绪转弱，limit_list_d limit_type=Z）
      score_delta: -6
    # 大宗交易折价>5% = 卖方急售折价出货，看空信号
    - when: "block_trade_avg_discount_rate < -0.05"
      level: medium
      flag: 大宗交易折价卖出（折价>5%，卖方急售看空，block_trade）
      score_delta: -5
    # 股东净减持（近30天变动比例<0）= 重要股东出货看空
    - when: "holder_trade_net_ratio < 0"
      level: medium
      flag: 股东净减持（近30天，stk_holdertrade）
      score_delta: -4
