# Gate against regressions of silently swallowed exceptions.
# Existing intentional sites carry `# noqa: BLE001`; new ones must justify themselves.
target-version = "py312"
extend-exclude = ["output", "node_modules", "data", "logs"]

[lint]
select = ["E9", "F63", "F7", "F82", "BLE001", "S110"]

[lint.per-file-ignores]
"tests/**" = ["BLE001", "S110"]
"scripts/**" = ["BLE001", "S110"]
# Owned by 炒股bot / conflict-prone: excluded from this gate until their owners clean them.
"app/services/market_auxiliary.py" = ["BLE001", "S110"]
"app/services/data_health_service.py" = ["BLE001", "S110"]
"app/services/auxiliary/**" = ["BLE001", "S110"]
"app/services/backtest/strategy_profile.py" = ["BLE001", "S110"]
"app/main.py" = ["BLE001", "S110"]
